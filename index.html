<script>
const categories=['Escalas','Acordes','Técnica','Improvisación','Repertorio','Calentamiento'];
const categoryColors={Escalas:'#4EEE7C',Acordes:'#FFD166','Técnica':'#4DA3FF','Improvisación':'#B276FF',Repertorio:'#FF6B7A',Calentamiento:'#FF9F43'};
const catColor=c=>categoryColors[c]||'#9AA2A2';
const warmups=['Sin calentamiento','Movilidad','Cromáticos','Digitación','Independencia de dedos','Técnica','Estiramientos suaves','Personalizado'];
// PREVIEW=true usa claves aisladas y no registra Service Worker. Poner false SOLO al publicar.
const PREVIEW=false;
// Freemium: FREEMIUM=false (hoy) = todo gratis y sin anuncios. Con true, quien no sea premium ve los huecos de anuncio.
// shortcut: premium se lee del dispositivo y se salta fácil; antes de cobrar, comprobarlo en un servidor.
const FREEMIUM=false,PREMIUM_KEY=PREVIEW?'practica_preview_premium':'practica_premium';
const esPremium=()=>!FREEMIUM||localStorage.getItem(PREMIUM_KEY)==='1';
// Huecos de anuncio con altura fija (el contenido no salta). Solo en Hoy, Progreso y Más; nunca sin conexión ni con una canción abierta (CSS has-mini).
const adSlot=place=>`<div class="ad-slot" data-ad="${place}" aria-hidden="true"></div>`;
const syncAds=()=>document.body.classList.toggle('ads',!esPremium()&&navigator.onLine);
const SESSIONS_KEY=PREVIEW?'practica_preview_sessions':'practica_sessions_v2';
const EXERCISES_KEY=PREVIEW?'practica_preview_exercises':'practica_exercises_v2';
const GOALS_KEY=PREVIEW?'practica_preview_goals':'practica_goals_v1';
const defaultGoals={dailyMinutes:120,weeklyDays:5,weeklyMinutes:600};
const goals=()=>{
  try{
    const raw={...defaultGoals,...JSON.parse(localStorage.getItem(GOALS_KEY)||'{}')};
    raw.dailyMinutes=Math.max(15,+raw.dailyMinutes||120);
    raw.weeklyDays=Math.min(7,Math.max(1,+raw.weeklyDays||5));
    raw.weeklyMinutes=Math.round(raw.dailyMinutes*raw.weeklyDays);
    raw.byCategory=cleanCatGoals(raw.byCategory,categories);
    return raw;
  }catch{
    return {...defaultGoals};
  }
};
const saveGoals=g=>{
  const clean={
    dailyMinutes:Math.max(15,+g.dailyMinutes||120),
    weeklyDays:Math.min(7,Math.max(1,+g.weeklyDays||5))
  };
  clean.weeklyMinutes=Math.round(clean.dailyMinutes*clean.weeklyDays);
  clean.byCategory=cleanCatGoals(g.byCategory,categories);
  localStorage.setItem(GOALS_KEY,JSON.stringify(clean));
};
const instruments=['Guitarra','Bajo'];
const instrumentOf=s=>s?.instrument==='Bajo'?'Bajo':'Guitarra';

function migrateV1(){
  if(PREVIEW||localStorage.getItem(SESSIONS_KEY))return;
  try{
    const old=JSON.parse(localStorage.getItem('practica_sessions_v1')||'[]');
    if(!old.length)return;
    const ex=[]; const byName={};
    const upgraded=old.map(s=>{
      const key=(s.topic||'Sin nombre').trim().toLowerCase();
      let e=byName[key];
      if(!e){
        e={
          id:uuid(),
          name:(s.topic||'Sin nombre').trim(),
          category:s.category||'Técnica',
          variants:[],
          createdAt:s.date||new Date().toISOString()
        };
        byName[key]=e;
        ex.push(e);
      }
      return {
        ...s,
        exerciseId:e.id,
        exerciseName:e.name,
        category:e.category,
        variantId:'',
        variantName:'',
        tempoBlocks:[]
      };
    });
    saveExercises(ex);
    saveSessions(upgraded);
  }catch{}
}

function ensureExercise(name,category){
  const clean=name.trim(); const all=exercises();
  let e=all.find(x=>x.name.toLowerCase()===clean.toLowerCase());
  if(e){ if(category&&e.category!==category){e.category=category;saveExercises(all)} return e; }
  e={id:uuid(),name:clean,category,variants:[],createdAt:new Date().toISOString()}; all.push(e);saveExercises(all);return e;
}

function sessionCard(s){
  const e=sessionExercise(s),blocks=s.tempoBlocks||[],legacyVariant=variantNameForSession(s,e);

  const groups=[];
  const byKey=new Map();

  blocks.forEach((b,index)=>{
    const variant=blockVariantName(b,e)||legacyVariant||'';
    const key=variant?(b.variantId||`name:${variant.toLowerCase()}`):'__no_variant__';

    if(!byKey.has(key)){
      const group={key,name:variant,blocks:[],firstIndex:index};
      byKey.set(key,group);
      groups.push(group);
    }
    byKey.get(key).blocks.push(b);
  });

  return `<div class="card session" data-session="${esc(s.id)}">
    <div class="dot" style="background:${catColor(e.category)}">♪</div>
    <div class="main">
      <h4>${esc(e.name)}</h4>
      <p><span class="cat-badge" style="--cat:${catColor(e.category)}">${esc(e.category)}</span> · ${instrumentOf(s)} · ${fmt(s.practiceMinutes)}</p>
      ${s.warmupMinutes?`<p>Calentamiento · ${fmt(s.warmupMinutes)}</p>`:''}
      ${groups.length?`<div class="variant-groups">${groups.map(g=>`
        <div class="variant-group">
          ${g.name?`<div class="variant-name">${esc(g.name)}</div>`:''}
          <div class="variant-blocks">
            ${g.blocks.map(b=>`
              <span class="tempo-chip-rich">
                <span class="tempo-bpm">${b.bpm} BPM</span>

              </span>`).join('')}
          </div>
        </div>`).join('')}</div>`:''}
    </div>
    <div class="chev">›</div>
  </div>`;
}
function goalBar(g,compact){
  if(!g)return '';
  const txt=g.done?`✓ Meta conseguida: ${g.goal} BPM`:g.best==null?`Meta ${g.goal} BPM · aún sin BPM registrados`:`Meta ${g.goal} BPM · te ${g.left===1?'falta 1':`faltan ${g.left}`} (mejor ${g.best})`;
  return `<div class="progress" style="margin:${compact?'6px 0 0':'10px 0 6px'}"><i style="width:${Math.round(g.pct*100)}%;${g.done?'background:#4EEE7C':''}"></i></div>${compact?'':`<div class="note">${txt}</div>`}`;
}

const sumMin=list=>list.reduce((n,s)=>n+(+s.practiceMinutes||0),0);
const dayDiff=(a,b)=>Math.round((startDay(b)-startDay(a))/864e5);
function bestStreak(daySet){
  let best=0,cur=0,prev=null;
  [...daySet].sort().forEach(k=>{const d=new Date(k+'T00:00');cur=prev&&dayDiff(prev,d)===1?cur+1:1;best=Math.max(best,cur);prev=d});
  return best;
}
function currentStreak(daySet,now=new Date()){
  let n=0,c=startDay(now);if(!daySet.has(isoDay(c)))c.setDate(c.getDate()-1);
  while(daySet.has(isoDay(c))){n++;c.setDate(c.getDate()-1)}
  return n;
}
// Máximo BPM por sesión (opcionalmente solo de una variante), ordenado por fecha ascendente.
function bpmSeries(list,e,variant=''){
  return list.map(s=>{
    const legacy=variantNameForSession(s,e);
    const bpms=(s.tempoBlocks||[]).filter(b=>!variant||(blockVariantName(b,e)||legacy)===variant).map(b=>+b.bpm).filter(b=>b>0);
    return bpms.length?{date:new Date(s.date),bpm:Math.max(...bpms),diff:+s.difficulty||3}:null;
  }).filter(Boolean).sort((a,b)=>a.date-b.date);
}
// Dificultad media por tramo de BPM (tramos de 1/5/10/20/40 para que salgan como mucho 8). null si hay un solo tramo.
function bpmDifficulty(series){
  if(!series.length)return null;
  const bpms=series.map(x=>x.bpm),lo=Math.min(...bpms),hi=Math.max(...bpms);
  const w=[1,5,10,20].find(w=>Math.floor(hi/w)-Math.floor(lo/w)<8)||40,g={};
  series.forEach(x=>{const k=Math.floor(x.bpm/w)*w;(g[k]=g[k]||[]).push(x)});
  const rows=Object.values(g).map(l=>{const b=l.map(x=>x.bpm);return {min:Math.min(...b),max:Math.max(...b),n:l.length,diff:l.reduce((n,x)=>n+x.diff,0)/l.length}}).sort((a,b)=>a.min-b.min);
  if(rows.length<2)return null;
  const easy=rows.filter(r=>r.diff<=2).at(-1),hard=rows.find(r=>r.diff>=4);
  return {rows,easyUpTo:easy?easy.max:null,hardFrom:hard?hard.min:null};
}
// Meta de BPM de un ejercicio: avance desde el primer BPM registrado hasta la meta, con el mejor BPM.
function bpmGoal(series,goal){
  if(!(goal>0))return null;
  if(!series.length)return {goal,best:null,start:null,pct:0,left:goal,done:false};
  const start=series[0].bpm,best=Math.max(...series.map(x=>x.bpm)),done=best>=goal;
  const pct=done?1:goal<=start?0:Math.max(0,Math.min(1,(best-start)/(goal-start)));
  return {goal,best,start,pct,left:Math.max(0,goal-best),done};
}

// Avance de la semana [start, start+7 días) de cada categoría con objetivo, en el orden de byCat.
function weekCategoryProgress(list,catOf,byCat,start){
  const end=new Date(start);end.setDate(end.getDate()+7);
  const done={};list.forEach(s=>{const d=new Date(s.date);if(d>=start&&d<end){const c=catOf(s);done[c]=(done[c]||0)+(+s.practiceMinutes||0)}});
  return Object.entries(byCat).map(([cat,goal])=>({cat,goal,done:done[cat]||0,pct:Math.min(1,(done[cat]||0)/goal)}));
}

// Aviso de copia: con prácticas nuevas desde la última copia y 7 días sin copiar (sin copia nunca: a partir de 3 prácticas). «Luego» lo calla 3 días.
function backupDue(last,snooze,dates,now=Date.now()){
  if(snooze&&now-new Date(snooze)<3*864e5)return 0;
  if(!last)return dates.length>=3?-1:0;
  const days=Math.floor((now-new Date(last))/864e5);
  return days>=7&&dates.some(d=>new Date(d)>new Date(last))?days:0;
}

function periodRange(period,now,offset=0){
  let from,to;
  if(period==='week'){from=startDay(now);from.setDate(from.getDate()-((now.getDay()+6)%7)+7*offset);to=new Date(from);to.setDate(to.getDate()+7)}
  if(period==='month'){from=new Date(now.getFullYear(),now.getMonth()+offset,1);to=new Date(now.getFullYear(),now.getMonth()+offset+1,1)}
  if(period==='year'){from=new Date(now.getFullYear()+offset,0,1);to=new Date(now.getFullYear()+offset+1,0,1)}
  return [from,to];
}

function bpmChart(series){
  if(series.length<2)return '';
  const W=320,H=150,l=34,r=10,t=12,b=24,min=Math.min(...series.map(x=>x.bpm)),max=Math.max(...series.map(x=>x.bpm));
  const lo=Math.max(0,min-5),hi=max+5,x=i=>l+i*(W-l-r)/(series.length-1),y=v=>t+(hi-v)*(H-t-b)/(hi-lo);
  const pts=series.map((p,i)=>`${x(i).toFixed(1)},${y(p.bpm).toFixed(1)}`).join(' ');
  const dl=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  return `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%" role="img" aria-label="Evolución de BPM">
    ${[min,max].map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="#282e2e" stroke-dasharray="3 4"/><text x="${l-6}" y="${y(v)}" text-anchor="end" dominant-baseline="central" font-size="10" fill="#909898">${v}</text>`).join('')}
    <polyline points="${pts}" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${series.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.bpm)}" r="3.5" fill="#00F0FF"/>`).join('')}
    <text x="${l}" y="${H-6}" font-size="10" fill="#909898">${dl(series[0].date)}</text>
    <text x="${W-r}" y="${H-6}" text-anchor="end" font-size="10" fill="#909898">${dl(series[series.length-1].date)}</text>
  </svg>`;
}

function heatmap(a,now){
  const g=Math.max(1,goals().dailyMinutes),byDay={};
  a.forEach(s=>{const k=isoDay(new Date(s.date));byDay[k]=(byDay[k]||0)+(+s.practiceMinutes||0)});
  const [weekStart]=periodRange('week',now),first=new Date(weekStart);first.setDate(first.getDate()-7*11);
  const cells=[];
  for(let w=0;w<12;w++)for(let d=0;d<7;d++){
    const day=new Date(first);day.setDate(first.getDate()+w*7+d);
    const m=byDay[isoDay(day)]||0,lvl=day>now?-1:m<=0?0:m<g*.34?1:m<g*.67?2:m<g?3:4;
    cells.push(`<rect x="${20+w*24}" y="${d*20}" width="18" height="16" rx="4" fill="${lvl<0?'transparent':lvl?`rgba(0,240,255,${[0,.22,.45,.7,1][lvl]})`:'#202525'}"><title>${day.toLocaleDateString('es-ES')} · ${fmt(m)}</title></rect>`);
  }
  return `<svg viewBox="0 0 310 140" style="display:block;width:100%" role="img" aria-label="Mapa de constancia, últimas 12 semanas">
    ${['L','X','V','D'].map((l,i)=>`<text x="6" y="${i*40+8}" dominant-baseline="central" font-size="10" fill="#909898">${l}</text>`).join('')}${cells.join('')}</svg>
    <div class="time-row mt2"><span>Hace 12 semanas</span><span>Menos ▢ → más ■ del objetivo</span></div>`;
}

const BACKUP_KEY=PREVIEW?'practica_preview_last_backup':'practica_last_backup',BACKUP_SNOOZE_KEY=BACKUP_KEY+'_snooze';
function lastBackupText(){
  const t=localStorage.getItem(BACKUP_KEY);
  if(!t)return 'Nunca exportada';
  const days=Math.floor((Date.now()-new Date(t))/864e5);
  return `Última: ${new Date(t).toLocaleDateString('es-ES')}${days>=7?` · hace ${days} días`:''}`;
}
// En iPhone, compartir permite "Guardar en Archivos"; si no existe, descarga normal. Devuelve 'ok', 'abort' o 'error'.
async function shareOrDownload(file){
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:file.name});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
    return 'ok';
  }catch(err){return err?.name==='AbortError'?'abort':'error'}
}
async function exportBackup(){
  const data={app:'practica',format:1,exportedAt:new Date().toISOString(),sessions:sessionStore,exercises:exerciseStore,goals:goals(),customScales,tuner:tunerPrefs,routine:routineItems};
  const name=`practica-backup-${isoDay(new Date())}.json`;
  const file=new File([JSON.stringify(data,null,1)],name,{type:'application/json'});
  const r=await shareOrDownload(file);if(r==='abort')return;if(r==='error')return toast('No se pudo exportar');
  localStorage.setItem(BACKUP_KEY,new Date().toISOString());renderMore();renderHome();toast('Copia exportada');
}
function parseBackup(text){
  const d=JSON.parse(text);
  if(d?.app!=='practica'||!Array.isArray(d.sessions)||!Array.isArray(d.exercises))throw new Error('formato');
  if(!d.sessions.every(s=>s&&s.id&&!isNaN(new Date(s.date))))throw new Error('sesiones');
  if(!d.exercises.every(e=>e&&e.id&&typeof e.name==='string'))throw new Error('ejercicios');
  return d;
}
async function importBackup(file){
  $('#importBackupFile').value='';
  if(!file)return;
  let d;
  try{d=parseBackup(await file.text())}catch{return toast('Archivo de copia no válido')}
  if(!confirm(`¿Importar ${d.sessions.length} prácticas y ${d.exercises.length} ejercicios? Se sustituirán los datos actuales de este dispositivo.`))return;
  saveExercises(d.exercises);saveSessions(d.sessions);if(d.goals)saveGoals(d.goals);
  if(Array.isArray(d.customScales))saveCustomScales(d.customScales.filter(validCustomScale));
  if(d.tuner&&typeof d.tuner==='object'){tunerPrefs=cleanTunerPrefs(d.tuner);saveTunerPrefs()}
  if(Array.isArray(d.routine)){routineItems=cleanRoutine(d.routine);saveRoutine()}
  renderAll();toast('Copia importada');
}

function saveVariantOnTheFly(){
  const exerciseId=$('#exercisePicker').value;
  const clean=$('#inlineVariantField').value.trim();
  if(!exerciseId)return toast('Elige primero un ejercicio');
  if(!clean)return toast('Escribe un nombre para la variante');

  const all=exercises(),stored=all.find(x=>x.id===exerciseId);
  if(!stored)return toast('No se ha encontrado el ejercicio');

  stored.variants=Array.isArray(stored.variants)?stored.variants:[];
  let variant=stored.variants.find(v=>v.name.toLowerCase()===clean.toLowerCase());

  if(!variant){
    variant={id:uuid(),name:clean};
    stored.variants.push(variant);
    saveExercises(all);
  }

  refreshTempoVariantSelects();

  // Si hay un último bloque sin variante, seleccionamos automáticamente la recién creada.
  const rows=$$('#tempoRows .tempo-row');
  const last=rows[rows.length-1];
  if(last){
    const sel=last.querySelector('.block-variant');
    if(sel&&!sel.value)sel.value=variant.id;
  }

  hideInlineVariantEditor();
  toast('Variante añadida');
}

function variantOptions(exerciseId,selectedId=''){
  const e=exercises().find(x=>x.id===exerciseId),vars=exerciseVariants(e);
  return `<option value="">Sin variante</option>`+vars.map(v=>`<option value="${esc(v.id)}" ${v.id===selectedId?'selected':''}>${esc(v.name)}</option>`).join('');
}
function refreshTempoVariantSelects(){
  const exerciseId=$('#exercisePicker')?.value||'';
  const e=exercises().find(x=>x.id===exerciseId);
  const hasVariants=exerciseVariants(e).length>0;
  $$('#tempoRows .tempo-row').forEach(row=>{
    const sel=row.querySelector('.block-variant');
    if(!sel)return;
    const current=sel.value;
    sel.innerHTML=variantOptions(exerciseId,current);
    if([...sel.options].some(o=>o.value===current))sel.value=current;
    row.classList.toggle('no-variants',!hasVariants);
  });
}
function chooseExercise(){
  hideInlineVariantEditor();
  const id=$('#exercisePicker').value;
  if(!id){refreshTempoVariantSelects();return}
  const e=exercises().find(x=>x.id===id);if(!e)return;
  $('#exerciseField').value=e.name;$('#category').value=e.category;
  refreshTempoVariantSelects()
}
function syncExerciseCategory(){
  const name=$('#exerciseField').value.trim().toLowerCase(),e=exercises().find(x=>x.name.toLowerCase()===name);
  if(e){
    $('#category').value=e.category;

function renderInstrument(){$('#instrumentSeg').innerHTML=instruments.map(x=>`<button type="button" data-instrument="${x}" class="${instrument===x?'active':''}">${x}</button>`).join('');$$('[data-instrument]').forEach(b=>b.onclick=()=>{instrument=b.dataset.instrument;renderInstrument()})}
function renderDifficulty(){$('#difficulty').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-diff="${n}" class="${difficulty===n?'active':''}">${n}</button>`).join('');$$('[data-diff]').forEach(b=>b.onclick=()=>{difficulty=+b.dataset.diff;renderDifficulty()})}
function addTempoRow(bpm='',minutes='',variantId='',variantName=''){
  const exerciseId=$('#exercisePicker')?.value||'';
  const e=exercises().find(x=>x.id===exerciseId);
  const hasVariants=exerciseVariants(e).length>0;
  const row=document.createElement('div');
  row.className='tempo-row'+(hasVariants?'':' no-variants');
  row.innerHTML=`
    <select class="block-variant" aria-label="Variante opcional">${variantOptions(exerciseId,variantId)}</select>
    <input class="block-bpm" type="number" min="20" max="400" step="1" inputmode="numeric" placeholder="BPM" value="${esc(bpm)}">
    <input class="block-minutes" type="number" min="1" step="1" inputmode="numeric" placeholder="Min opc." value="${esc(minutes)}">
    <button type="button" class="remove">×</button>`;
  const sel=row.querySelector('.block-variant');
  if(variantId&&[...sel.options].some(o=>o.value===variantId))sel.value=variantId;
  row.dataset.legacyVariantName=variantName||'';
  row.querySelector('.remove').onclick=()=>{row.remove();updateTotal()};
  row.querySelectorAll('input,select').forEach(i=>i.oninput=updateTotal);
  $('#tempoRows').appendChild(row);
  updateTotal()
}
function getTempoBlocks(){
  const exerciseId=$('#exercisePicker')?.value||'';
  const e=exercises().find(x=>x.id===exerciseId);
  return $$('#tempoRows .tempo-row').map(r=>{
    const variantId=r.querySelector('.block-variant')?.value||'',
          v=exerciseVariants(e).find(x=>x.id===variantId),
          minuteRaw=r.querySelector('.block-minutes')?.value.trim()||'';
    return {
      variantId,
      variantName:v?.name||r.dataset.legacyVariantName||'',
      bpm:+r.querySelector('.block-bpm')?.value||0,
      minutes:minuteRaw===''?null:Math.max(0,+minuteRaw||0)
    }
  }).filter(x=>x.bpm>0)
}
function updateTotal(){
  const w=$('#warmup').value==='Sin calentamiento'?0:+$('#warmupMinutes').value||0,
        p=Math.max(0,+$('#practiceMinutes').value||0),
        blocks=getTempoBlocks(),
        timedBlocks=blocks.filter(b=>b.minutes!=null&&b.minutes>0),
        untimedBlocks=blocks.filter(b=>b.minutes==null||b.minutes===0),
        assigned=timedBlocks.reduce((n,b)=>n+(+b.minutes||0),0);
  $('#warmupMinutes').disabled=$('#warmup').value==='Sin calentamiento';
  $('#totalPreview').textContent=fmt(w+p);

  const rem=p-assigned,el=$('#tempoSummary');
  if(!blocks.length){
    el.textContent='Sin bloques de práctica';
    el.classList.remove('warn');
  }else if(!timedBlocks.length){
    el.textContent=`${blocks.length} ${blocks.length===1?'tempo registrado':'tempos registrados'} · sin reparto de minutos`;
    el.classList.remove('warn');
  }else if(rem>0){
    el.textContent=`${fmt(assigned)} asignados${untimedBlocks.length?` · ${untimedBlocks.length} ${untimedBlocks.length===1?'bloque sin minutos':'bloques sin minutos'}`:''} · ${fmt(rem)} sin asignar`;
    el.classList.remove('warn');
  }else if(rem===0){
    el.textContent=`${fmt(assigned)} asignados${untimedBlocks.length?` · ${untimedBlocks.length} ${untimedBlocks.length===1?'bloque sin minutos':'bloques sin minutos'}`:''} · práctica completa`;
    el.classList.remove('warn');
  }else{
    el.textContent=`Los bloques con minutos superan la práctica por ${fmt(-rem)}`;
    el.classList.add('warn');
  }
}
function resetForm(){if($('#inlineVariantEditor'))hideInlineVariantEditor();$('#exerciseField').value='';$('#category').value=categories[0];$('#warmup').value=warmups[0];$('#warmupMinutes').value=0;$('#practiceMinutes').value=15;$('#notes').value='';difficulty=3;instrument=sessions().length?instrumentOf(sessions()[0]):tunerPrefs.instrument;renderInstrument();$('#tempoRows').innerHTML='';$('#date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);renderDifficulty();refreshExerciseDatalist();refreshExercisePicker();$('#exercisePicker').value='';refreshTempoVariantSelects();renderRecentChips();$('#moreDetails').open=false;syncPresetChips();updateTotal()}
function saveSession(){
  const fromPlayer=sessionFromPlayer,fromMetro=sessionFromMetro;
  const name=$('#exerciseField').value.trim();if(!name)return toast('Escribe un ejercicio');
  const p=Math.max(1,+$('#practiceMinutes').value||0),
        blocks=getTempoBlocks(),
        assigned=blocks.reduce((n,b)=>n+(b.minutes==null?0:(+b.minutes||0)),0);
  if(assigned>p)return toast('Los bloques con minutos superan la duración');

  const e=ensureExercise(name,$('#category').value),
        w=$('#warmup').value==='Sin calentamiento'?0:+$('#warmupMinutes').value||0,
        d=$('#date').value?new Date($('#date').value):new Date(),
        a=sessions();

  const data={
    exerciseId:e.id,exerciseName:e.name,category:e.category,instrument,
    variantId:'',variantName:'',
    warmup:$('#warmup').value,warmupMinutes:w,practiceMinutes:p,
    tempoBlocks:blocks,date:d.toISOString(),difficulty,notes:$('#notes').value.trim()
  };

  if(editingSessionId){
    const i=a.findIndex(x=>x.id===editingSessionId);
    if(i===-1){
      toast('No se encontró la práctica a editar');
      return;
    }
    a[i]={...a[i],...data};
    saveSessions(a);
    closeSessionModal();
    renderAll();
    tab('home');
    requestAnimationFrame(()=>document.querySelector('.app')?.scrollTo({top:0,behavior:'smooth'}));
    toast('Práctica actualizada');
  }else{
    // ¿Esta práctica alcanza por primera vez la meta de BPM del ejercicio?
    const prevBest=Math.max(0,...a.filter(x=>x.exerciseId===e.id).flatMap(x=>(x.tempoBlocks||[]).map(b=>+b.bpm||0)));
    const newBest=Math.max(0,...blocks.map(b=>+b.bpm||0));
    const doneMsg=e.goalBpm&&prevBest<e.goalBpm&&newBest>=e.goalBpm?`¡Meta conseguida: ${e.goalBpm} BPM!`:'Práctica guardada';
    const saved={id:uuid(),...data};
    a.push(saved);
    saveSessions(a);

    const confirmed=sessionStore.some(x=>x.id===saved.id);
    if(!confirmed){
      toast('No se pudo guardar la práctica');
      return;
    }

    closeSessionModal();
    renderAll();
    if(fromMetro&&$('#metroBody')){
      metroPractice.clear();renderMetro();toast(doneMsg);
      return;
    }
    if(fromPlayer&&player){
      // Se vuelve al reproductor sin cortar la música; el cronómetro empieza de cero.
      player.practice=new Map();practiceTick();
      if($('#playBtn'))renderPlayer();
      syncMini();
      toast(doneMsg);
      return;
    }
    tab('home');
    requestAnimationFrame(()=>document.querySelector('.app')?.scrollTo({top:0,behavior:'smooth'}));
    toast(doneMsg);
  }
}

function readVariantEditor(containerId){
  const seen=new Set(),out=[];
  $$(`#${containerId} .variant-editor-row`).forEach(r=>{
    const name=r.querySelector('input').value.trim();if(!name)return;
    const key=name.toLowerCase();if(seen.has(key))return;
    seen.add(key);out.push({id:r.dataset.variantId||uuid(),name})
  });
  return out
}

function saveEditedExercise(id){
  const name=$('#editExerciseField').value.trim(),category=$('#editExerciseCategory').value,variants=readVariantEditor('editExerciseVariants');
  if(!name)return toast('Escribe un nombre');
  const goalRaw=$('#editGoalBpm').value.trim(),goalBpm=validGoalBpm(goalRaw);
  if(goalRaw&&!goalBpm)return toast('El BPM objetivo va de 30 a 400');
  const all=exercises(),e=all.find(x=>x.id===id);if(!e)return;
  if(all.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return toast('Ya existe un ejercicio con ese nombre');

  e.name=name;e.category=category;e.variants=variants;if(goalBpm)e.goalBpm=goalBpm;else delete e.goalBpm;saveExercises(all);

  const variantMap=new Map(variants.map(v=>[v.id,v.name]));
  saveSessions(sessions().map(s=>{
    if(s.exerciseId!==id)return s;
    return {
      ...s,
      exerciseName:name,
      category,
      variantName:s.variantId&&variantMap.has(s.variantId)?variantMap.get(s.variantId):(s.variantName||''),
      tempoBlocks:(s.tempoBlocks||[]).map(b=>({
        ...b,
        variantName:b.variantId&&variantMap.has(b.variantId)?variantMap.get(b.variantId):(b.variantName||'')
      }))
    }
  }));

  renderAll();openExerciseDetail(id);toast('Ejercicio actualizado')
}

function deleteSavedExercise(id){
  const e=exercises().find(x=>x.id===id);if(!e)return;
  const linked=sessions().filter(s=>s.exerciseId===id);

// Tramos [{t,pc,q}] (q 'maj'|'min'; pc null = sin acorde). Los de menos de minDur se funden con el anterior.
// hop = segundos entre trozos; off = desfase del cambio (medio trozo).
function chordSegments(states,hop,off,minDur=.6){
  const g=[];states.forEach((s,i)=>{if(g.length&&g.at(-1).s===s)g.at(-1).len++;else g.push({s,i,len:1})});
  const out=[];for(const x of g){if(out.length&&(x.len*hop<minDur||out.at(-1).s===x.s)){out.at(-1).len+=x.len;continue}out.push({...x})}
  return out.map(x=>({t:x.i?Math.round((x.i*hop+off)*100)/100:0,pc:x.s===24?null:x.s%12,q:x.s===24?null:x.s<12?'maj':'min'}));
}
const chordName=(pc,q)=>pc==null?'—':keyTonic(pc,q==='min'?'minor':'major')+(q==='min'?'m':'');
// Octavación: lectura estable = últimas 12 lecturas (~0,5 s) dentro de 3 cents; devuelve su mediana o null.
function stableCents(buf){
  if(buf.length<12)return null;
  const last=buf.slice(-12);if(Math.max(...last)-Math.min(...last)>3)return null;
  return [...last].sort((a,b)=>a-b)[6];
}
// Traste 12 frente a cuerda al aire: ±3 cents = bien; alto = cuerda corta (alargar: selleta hacia atrás); bajo = al revés.
function intonationAdvice(open,fret){
  const diff=Math.round((fret-open)*10)/10;
  return {diff,verdict:Math.abs(diff)<=3?'ok':diff>0?'sharp':'flat'};
}

function circleSvg(){
  const cx=160,cy=160,pos=(i,r)=>{const a=(i*30-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const ring=scaleState.ring||(scaleState.mode==='minor'?'minor':'major');
  const key=(mode,n,i,r,size)=>{
    const [x,y]=pos(i,r),sel=ring===mode&&scaleState.tonic===n;
    const label=mode==='major'?pretty(n):pretty(n)+'m';
    return `<g data-key="${mode}:${n}" role="button" aria-label="${spanishName(n,mode)}">
      <circle cx="${x}" cy="${y}" r="${size}" fill="${sel?'rgba(0,240,255,.24)':'transparent'}" stroke="${sel?'rgba(0,240,255,.6)':'transparent'}"/>
      <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${mode==='major'?15:12}" ${sel?'style="fill:#00F0FF"':''}>${label}</text></g>`;
  };
  return `<svg class="circle5" viewBox="0 0 320 320">
    <circle cx="160" cy="160" r="150" fill="#151818" stroke="#202525"/>
    <circle cx="160" cy="160" r="104" fill="#111414" stroke="#202525"/>
    <circle cx="160" cy="160" r="62" fill="#0b0e0e" stroke="#202525"/>
    <text x="160" y="152" text-anchor="middle" font-size="11" style="fill:#909898;font-weight:600">Mayores fuera</text>
    <text x="160" y="170" text-anchor="middle" font-size="11" style="fill:#909898;font-weight:600">Menores dentro</text>
    ${CIRCLE_MAJOR.map((n,i)=>key('major',n,i,127,21)).join('')}
    ${CIRCLE_MINOR.map((n,i)=>key('minor',n,i,83,19)).join('')}
  </svg>`;
}

// Mástil en horizontal como en una tablatura: cuerda más aguda arriba, cejuela a la izquierda.
// Más ancho que el móvil: se desliza de lado dentro de su tarjeta.
function fretboardSvg(quiz){
  const tuning=scaleTuning(),n=tuning.length;let frets=15;
  const labels=scaleDef(scaleState.mode).labels,scale=spellScale(scaleState.tonic,scaleState.mode),pcs=scale.map(notePc);
  const ch=scaleState.chord!=null?diatonicChord(labels,scaleState.chord,scaleState.chord7):null;
  const pos=!ch&&!quiz&&scaleState.pos!=null?scalePosition(tuning,scaleState.instrument,scaleState.tonic,labels,scaleState.pos,frets):null;
  const inPos=pos&&new Set(pos.map(x=>x.s+':'+x.f));
  if(pos)frets=Math.max(15,...pos.map(x=>x.f)); // algunas posiciones llegan al traste 18
  const nut=58,fretW=44,top=18,gap=34,W=nut+frets*fretW+16,bottom=top+(n-1)*gap,H=bottom+38;
  const xOf=f=>f===0?nut-24:nut+(f-.5)*fretW,yOf=i=>bottom-i*gap,mid=(top+bottom)/2;
  let out=`<svg class="fretboard" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mástil de ${scaleState.instrument.toLowerCase()} de ${n} cuerdas">`;
  out+=`<rect x="${nut}" y="${top-8}" width="${frets*fretW}" height="${bottom-top+16}" rx="4" fill="#151818"/>`;
  [3,5,7,9,15,17].filter(f=>f<=frets).forEach(f=>out+=`<circle cx="${xOf(f)}" cy="${mid}" r="5" fill="#2a3131"/>`);
  out+=`<circle cx="${xOf(12)}" cy="${mid-gap}" r="5" fill="#2a3131"/><circle cx="${xOf(12)}" cy="${mid+gap}" r="5" fill="#2a3131"/>`;
  for(let f=1;f<=frets;f++)out+=`<line x1="${nut+f*fretW}" x2="${nut+f*fretW}" y1="${top-8}" y2="${bottom+8}" stroke="#3a4242" stroke-width="2"/>`;
  out+=`<line x1="${nut}" x2="${nut}" y1="${top-8}" y2="${bottom+8}" stroke="#d9dede" stroke-width="5"/>`;
  [3,5,7,9,12,15,17].filter(f=>f<=frets).forEach(f=>out+=`<text x="${xOf(f)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#909898">${f}</text>`);
  tuning.forEach((t,i)=>{
    out+=`<text x="8" y="${yOf(i)}" dominant-baseline="central" font-size="11" fill="#909898">${pretty(t)}</text>`;
    out+=`<line x1="${nut}" x2="${W-16}" y1="${yOf(i)}" y2="${yOf(i)}" stroke="#7d8787" stroke-width="${1+(n-1-i)*.35}"/>`;
    for(let f=0;f<=frets&&!quiz;f++){
      const d=pcs.indexOf((notePc(t)+f)%12),k=ch?ch.idx.indexOf(d):-1;
      if(d<0||(ch?k<0:!scaleState.degrees[d])||(inPos&&!inPos.has(i+':'+f)))continue;
      const lab=ch?ch.iv[k]:labels[d],label=pretty(scaleState.labels==='degrees'?lab:scale[d]);
      out+=`<circle cx="${xOf(f)}" cy="${yOf(i)}" r="13" fill="${degreeColor(lab)}" ${f===0?'stroke="#f7f9f9" stroke-width="1.5"':''}/>
        <text x="${xOf(f)}" y="${yOf(i)}" text-anchor="middle" dominant-baseline="central" font-size="${label.length>2?9:11}" font-weight="800" fill="#00131f">${label}</text>`;
    }
  });
  if(quiz){const c={ok:'#4EEE7C',bad:'#ff655f'}[quiz.state]||'#00F0FF';
    out+=`<circle id="quizMark" cx="${xOf(quiz.f)}" cy="${yOf(quiz.s)}" r="14" fill="${c}"/><text x="${xOf(quiz.f)}" y="${yOf(quiz.s)}" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="800" fill="#00131f">${quiz.label||'?'}</text>`}
  return out+'</svg>';
}

const tunerCombo=()=>{const i=tunerPrefs.instrument,n=tunerPrefs.strings?.[i],ok=i==='Bajo'?[4,5]:[6,7];return `${i} ${ok.includes(n)?n:ok[0]}`};
function tunerTuning(){

let tuner=null,tunerLock=null,tunerFromPlayer=false,refCtx=null;
const tunerTuned=new Set(); // cuerdas que han aguantado ±2 cents medio segundo
const median=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]};
// Comprobación de octavación: {s: cuerda, step: 'open'|'fret', open, buf, waitQuiet, results: {cuerda: {diff, verdict}}}
let tunerOctave=null;
const OCTAVE_TEXT={ok:'Bien: no hace falta tocar el puente',sharp:'Traste 12 alto → alarga la cuerda: lleva la selleta hacia atrás (lejos del mástil)',flat:'Traste 12 bajo → acorta la cuerda: lleva la selleta hacia el mástil'};
function octaveCard(){
  const o=tunerOctave,tu=tunerTuning();if(!o)return '';
  const name=i=>splitNote(tu.names[i]).join(''),r=o.results[o.s],fmtC=c=>`${c>0?'+':''}${fmtNum(c)} cents`;
  const done=Object.entries(o.results).filter(([i])=>+i!==o.s);
  return `<div class="card mt2">
    <div class="cat-row" style="border:0;padding:0 0 8px"><div class="grow"><strong>Octavación · cuerda ${name(o.s)}</strong><div class="muted tsub">Toca una cuerda de abajo para cambiar</div></div><button type="button" class="chip-btn" id="octExit">Salir</button></div>
    <div class="cat-row"><div class="grow">1 · Al aire</div><span>${o.open!=null?fmtC(o.open):o.step==='open'?'<span class="muted">esperando…</span>':''}</span></div>
    <div class="cat-row"><div class="grow">2 · Traste 12 (pisado)</div><span>${r?fmtC(o.open+r.diff):o.step==='fret'?'<span class="muted">esperando…</span>':'<span class="muted">—</span>'}</span></div>
    ${r?`<div class="tuner-hint" style="text-align:left;color:${r.verdict==='ok'?'var(--accent)':'#FFD166'}">${r.verdict==='ok'?'✓ ':''}Diferencia ${fmtC(r.diff)}. ${OCTAVE_TEXT[r.verdict]}</div>
      ${r.verdict==='ok'?'':'<div class="note">Afloja la cuerda antes de mover la selleta, vuelve a afinar y repite.</div>'}
      <button type="button" class="secondary wide mt3" id="octAgain">Repetir esta cuerda</button>`:''}
    ${done.length?`<div class="note mt3">${done.map(([i,x])=>`${name(+i)}: ${x.verdict==='ok'?'bien':x.verdict==='sharp'?`${fmtC(x.diff)} ↑`:`${fmtC(x.diff)} ↓`}`).join(' · ')}</div>`:''}
  </div>`;
}
// Recibe cada lectura del afinador mientras se comprueba la octavación.
function octaveFeed(cents,idx){
  const o=tunerOctave;if(!o||o.waitQuiet||idx!==o.s||o.results[o.s])return;
  o.buf.push(cents);if(o.buf.length>24)o.buf.shift();
  const c=stableCents(o.buf);if(c==null)return;
  navigator.vibrate?.(40);o.buf=[];
  if(o.step==='open'){o.open=c;o.step='fret';o.waitQuiet=true}
  else o.results[o.s]=intonationAdvice(o.open,c);
  renderTuner();
}

// En afinaciones se nombran con bemol (Mi♭, Si♭…), como se dice en la práctica.
const flatName=m=>{const r=Math.round(m);return ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'][(r%12+12)%12]+(Math.floor(r/12)-1)};
const splitNote=n=>[pretty(n.replace(/-?\d+$/,'')),n.match(/-?\d+$/)[0]];
const fmtNum=(v,d=1)=>v.toFixed(d).replace('.',',');

function openTuner(fromPlayer=false){
  tunerFromPlayer=fromPlayer&&!!player;
  const m=$('#toolModal');
  m.innerHTML=`<div class="topbar"><button id="closeTuner">Cerrar</button><h2>Afinador</h2><button aria-hidden="true" tabindex="-1"></button></div><div class="form" id="tunerBody"></div>`;
  m.classList.add('open');m.scrollTop=0;
  $('#closeTuner').onclick=()=>{stopTuner();if(tunerFromPlayer&&player)return openStems(player.song.id);m.classList.remove('open');syncMini()};
  renderTuner();
}
function gaugeSvg(){
  let ticks='';
  for(let c=-50;c<=50;c+=5){const a=(c*.9-90)*Math.PI/180,big=c%25===0,r1=big?104:112,x=k=>150+k*Math.cos(a),y=k=>158+k*Math.sin(a);
    ticks+=`<line x1="${x(r1)}" y1="${y(r1)}" x2="${x(124)}" y2="${y(124)}" stroke="${c?'#3a4242':'#d9dede'}" stroke-width="${big?2.5:1.5}"/>`;
    if(big)ticks+=`<text x="${x(90)}" y="${y(90)}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#909898">${c>0?'+':''}${c}</text>`}
  const z=d=>{const a=(d*.9-90)*Math.PI/180;return `${150+128*Math.cos(a)} ${158+128*Math.sin(a)}`};
  return `<svg class="tuner-gauge" viewBox="0 0 300 172" aria-hidden="true">
    <path d="M150 158 L${z(-2)} A128 128 0 0 1 ${z(2)} Z" fill="rgba(0,240,255,.22)"/>${ticks}
    <g id="tNeedle"><line x1="150" y1="158" x2="150" y2="40" stroke="var(--tc)" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="158" r="7" fill="var(--tc)"/></g></svg>`;
}
// Tarjeta "Afinación para «canción»": analiza las pistas separadas y propone afinación y La de referencia.
function tunerSongPlan(){
  const a=player?.song.tuning;if(!a)return null;
  const bass=tunerPrefs.instrument==='Bajo',low0=bass?(a.bass??(a.guitar!=null?a.guitar-12:null)):(a.guitar??(a.bass!=null?a.bass+12:null));
  if(low0==null)return {none:true};
  const low=low0+(player.semi||0),inst=tunerPrefs.instrument;
  for(const n of bass?[tunerPrefs.strings.Bajo,4,5]:[tunerPrefs.strings.Guitarra,6,7]){
    const combo=`${inst} ${n}`;if(!TUNER_TUNINGS[combo])continue;
    const s=suggestTuning(combo,low);if(s)return {...s,n,low,a4:a.steady>.5?Math.round(440*2**(a.cents/1200)*10)/10:440};
  }
  return {low,a4:440};
}
function tunerSongCard(){
  if(!player)return '';
  const s=player.song,plan=tunerSongPlan(),name=`<strong>${esc(s.name)}</strong>`;
  if(!plan)return `<div class="card tuner-song"><div class="grow">${name}<div class="muted tsub">Analiza sus pistas para proponerte la afinación que encaja</div></div><button class="secondary" id="tAnalyze" type="button">Analizar</button></div>`;
  if(plan.none)return `<div class="card tuner-song"><div class="grow">${name}<div class="muted tsub">No se encontraron notas claras de bajo o guitarra</div></div><button class="secondary" id="tAnalyze" type="button">Repetir</button></div>`;
  const semi=player.semi?` · con el tono a ${player.semi>0?'+':''}${player.semi}`:'';
  const what=plan.id?`Encaja: <b>${plan.name}</b>${plan.n!==(tunerPrefs.strings[tunerPrefs.instrument])?` (${plan.n} cuerdas)`:''}${plan.alt.length?` <span class="muted">o ${plan.alt.join(', ')}</span>`:''}${plan.exact?'':` <span class="muted">(llegas a ${pretty(flatName(plan.low))} sin cambiar la afinación)</span>`}`:`Baja hasta ${pretty(flatName(plan.low))}: no cabe en ${tunerPrefs.instrument.toLowerCase()}`;
  return `<div class="card tuner-song"><div class="grow">${name}<div class="tsub">${what}</div><div class="muted tsub">Nota más grave ${pretty(flatName(plan.low))} · La = ${fmtNum(plan.a4)} Hz${semi}</div></div>${plan.id?'<button class="primary" id="tApplySong" type="button">Aplicar</button>':''}</div>`;
}
// ---------- Tonalidad de la canción (se guarda en el tono original; se muestra transportada con p.semi) ----------
function songKeyNow(){

  const semi=player.semi||0,name=(pc,mode)=>spanishName(keyTonic(pc+semi,mode),mode);
  return {tonic:keyTonic(k.pc+semi,k.mode),mode:k.mode,label:name(k.pc,k.mode),alt:k.conf<.1?name(k.altPc,k.altMode):null};
}
function songKeyHtml(){

  const txt=player.song.key?k?`<b>${k.label}</b>${k.alt?` <span class="muted">o ${k.alt}</span>`:''}<span class="muted">${semi}</span>`
    :'<span class="muted">No se encontraron notas claras</span>':'<span class="muted">Detecta la tonalidad para abrir su escala</span>';
  return `<div class="grow"><strong>Tonalidad</strong><div class="tsub">${txt}</div></div><button class="secondary" id="songKey" type="button">${k?'Ver escala':'Analizar'}</button>`;
}
function openSongKeyScale(){
  const k=songKeyNow();if(!k)return;
  scaleState.tonic=k.tonic;setScaleMode(k.mode);openScales(true);
}
async function analyzeSongKey(){
  const p=player;if(!p)return;
  const btn=$('#songKey');if(btn){btn.disabled=true;btn.textContent='Analizando…'}
  if(!p.song.tuning)await analyzeSongTuning(); // el desvío fino (p. ej. canciones a 432 Hz) afina el croma
  const t=p.song.tuning,cents=t?.steady>.5?t.cents:0;
  const stems=STEM_ORDER.filter(k=>k!=='drums'&&p.data[k]).map(k=>p.data[k]);
  const n=Math.floor((p.song.frames*2)/8),F=4096,acc=new Float64Array(12),fr=new Float32Array(F);
  for(let i=0;i+F<=n;i+=F){
    // Pistas sin batería sumadas, estéreo 44,1 kHz → mono 11.025 Hz
    let e=0;for(let j=0;j<F;j++){let v=0;const o=(i+j)*8;for(const d of stems)for(let q=0;q<8;q++)v+=d[o+q];fr[j]=v/262144;e+=fr[j]*fr[j]}
    if(Math.sqrt(e/F)>.01){const c=chromaFrame(fr,11025,cents),sum=c.reduce((a,b)=>a+b)||1;for(let q=0;q<12;q++)acc[q]+=c[q]/sum}
    if(i%(F*20)===0)await new Promise(r=>setTimeout(r));
  }
  const k=detectKey(acc);
  p.song.key=k?{pc:k.pc,mode:k.mode,conf:Math.round(k.conf*1000)/1000,altPc:k.alt.pc,altMode:k.alt.mode}:{pc:null};
  await putSong(p.song).catch(()=>{});
  if(player===p&&$('#songKey'))renderPlayer();
}
// Acordes: pistas sin batería ni voz (la melodía confunde), trozos de 0,37 s cada 0,19 s.
async function analyzeSongChords(){
  const p=player;if(!p)return;
  const btn=$('#songChords');if(btn){btn.disabled=true;btn.textContent='Analizando…'}
  if(!p.song.tuning)await analyzeSongTuning();
  const t=p.song.tuning,cents=t?.steady>.5?t.cents:0;
  let keys=STEM_ORDER.filter(k=>k!=='drums'&&k!=='vocals'&&p.data[k]);if(!keys.length)keys=STEM_ORDER.filter(k=>k!=='drums'&&p.data[k]);
  const stems=keys.map(k=>p.data[k]),n=Math.floor(p.song.frames/4),F=4096,H=2048,mono=new Float32Array(n),frames=[];
  for(let i=0;i<n;i++){let v=0;const o=i*8;for(const d of stems)for(let q=0;q<8;q++)v+=d[o+q];mono[i]=v/262144}
  for(let i=0;i+F<=n;i+=H){
    const fr=mono.subarray(i,i+F);let e=0;for(let j=0;j<F;j++)e+=fr[j]*fr[j];
    frames.push(Math.sqrt(e/F)>.01?chordScores(chromaFrame(fr,11025,cents)):null);
    if(frames.length%40===0)await new Promise(r=>setTimeout(r));
  }
  p.song.chords=chordSegments(chordPath(frames),H/11025,F/2/11025);
  await putSong(p.song).catch(()=>{});
  if(player===p&&$('#songChords'))renderPlayer();
}
// Acorde que suena y los dos siguientes (transportados si el tono está cambiado).
function paintChordNow(){
  const p=player,l=p?.song.chords,el=$('#chordNow');if(!l?.length||!el)return;
  const k=sectionAt(l,songPos()),nm=c=>pretty(chordName(c.pc==null?null:c.pc+(p.semi||0),c.q));
  const html=`<span class="muted">Acorde</span><b>${k<0?'—':nm(l[k])}</b><span class="muted">${l.slice(k+1,k+3).map(c=>'→ '+nm(c)).join(' ')}</span>`;
  if(el.innerHTML!==html)el.innerHTML=html;
}
async function analyzeSongTuning(){
  const p=player;if(!p)return;
  const btn=$('#tAnalyze');if(btn){btn.disabled=true;btn.textContent='Analizando…'}
  const low={},all=[];
  for(const [k,minF,maxF] of [['bass',27,420],['guitar',55,1100]]){
    const d=p.data[k];if(!d)continue;
    // Estéreo intercalado 44,1 kHz → mono a 11.025 Hz (media de 4 muestras por canal)
    const n=Math.floor(d.length/8),mono=new Float32Array(n),F=2048,midis=[];
    for(let i=0;i<n;i++){let s=0;for(let j=0;j<8;j++)s+=d[i*8+j];mono[i]=s/262144}
    for(let i=0;i+F<=n;i+=F){
      const fr=mono.subarray(i,i+F);let e=0;for(let j=0;j<F;j++)e+=fr[j]*fr[j];
      if(Math.sqrt(e/F)>.02){const r=yinPitch(fr,11025,minF,maxF);if(r.clarity>.9)midis.push(freqMidi(r.freq))}
      if(i%(F*40)===0)await new Promise(r=>setTimeout(r));
    }
    const t=tuningFromPitches(midis);if(t){low[k]=t.lowest;all.push(...midis)}
  }
  const t=tuningFromPitches(all);
  p.song.tuning=t?{bass:low.bass??null,guitar:low.guitar??null,cents:t.cents,steady:Math.round(t.steady*100)/100}:{bass:null,guitar:null,cents:0,steady:0};
  await putSong(p.song).catch(()=>{});
  if($('#tunerBody'))renderTuner();
}

function renderTuner(){
  const pr=tunerPrefs,tu=tunerTuning(),combo=tunerCombo(),list=TUNER_TUNINGS[combo];
  const seg=(attr,items,cur)=>`<div class="seg${items.length===2?' two':''}">${items.map(([k,l])=>`<button type="button" ${attr}="${k}" class="${cur===k?'active':''}">${l}</button>`).join('')}</div>`;
  const nStr=+combo.split(' ')[1];
  $('#tunerBody').innerHTML=`
    ${seg('data-tinst',[['Guitarra','Guitarra'],['Bajo','Bajo']],pr.instrument)}
    <div class="string-row">${(pr.instrument==='Bajo'?[4,5]:[6,7]).map(k=>`<button type="button" class="chip-btn${nStr===k?' on':''}" data-tstrings="${k}" aria-pressed="${nStr===k}">${k} cuerdas</button>`).join('')}</div>
    <div class="field mt1 mb3"><select id="tTuning" aria-label="Afinación">${list.map(t=>`<option value="${t[0]}" ${tu.id===t[0]?'selected':''}>${t[1]} · ${t[2].split(' ').map(n=>pretty(n.replace(/\d/,''))).join(' ')}</option>`).join('')}<option value="custom" ${tu.id==='custom'?'selected':''}>Propia…</option></select></div>
    ${tu.id==='custom'?`<div class="card tuner-custom">${tu.midis.map((m,i)=>`<div><button type="button" data-cdown="${i}" aria-label="Bajar cuerda ${i+1}">−</button><b>${splitNote(midiName(m)).join('')}</b><button type="button" data-cup="${i}" aria-label="Subir cuerda ${i+1}">+</button></div>`).join('')}</div>`:''}
    ${tunerSongCard()}
    <div class="card tuner-display" id="tunerDisplay">
      <div class="tuner-top"><span class="muted" id="tMode">${pr.chromatic?'Cromático':tunerLock!=null?`Cuerda fija: ${splitNote(tu.names[tunerLock]).join('')}`:'Auto: detecta la cuerda'}</span><button type="button" id="tRef" class="icon-btn" aria-label="Escuchar la nota de referencia">♪</button></div>
      <div class="tuner-note"><span id="tNote">–</span><sub id="tOct"></sub></div>
      ${pr.view==='strobe'?'<canvas class="tuner-strobe" id="tStrobe" width="640" height="180" aria-hidden="true"></canvas>':gaugeSvg()}
      <div class="tuner-cents"><b id="tCents">—</b> cents · <span id="tHz">— Hz</span></div>
      <div class="tuner-hint" id="tHint" aria-live="polite"></div>
    </div>
    ${pr.chromatic?'':`<div class="tuner-strings">${tu.names.map((n,i)=>`<button type="button" class="tstr${tunerLock===i?' lock':''}${tunerTuned.has(i)?' ok':''}" data-tstring="${i}" aria-pressed="${tunerLock===i}"><b>${splitNote(n)[0]}</b><small>${splitNote(n)[1]}</small></button>`).join('')}</div>
    ${tunerOctave?'':`<div class="muted tuner-all" id="tAll">${tunerTuned.size===tu.midis.length?'✓ Todas afinadas':'Toca una cuerda para fijarla · otra vez para volver a auto'}</div>`}`}
    ${octaveCard()}
    <button type="button" class="primary wide" id="tMic" style="margin-top:${tunerOctave?10:0}px">${tuner?'Parar':`${ic('mic')} Empezar a afinar`}</button>
    <div class="section-title">Ajustes</div>
    <div class="card">
      ${seg('data-tview',[['needle','Aguja'],['strobe','Estroboscopio']],pr.view)}
      <div class="cat-row" style="border-bottom:0;padding:4px 0 10px"><div class="grow">Modo cromático<div class="muted tsub">Cualquier nota, sin cuerdas</div></div><button type="button" class="chip-btn${pr.chromatic?' on':''}" id="tChrom" aria-pressed="${pr.chromatic}">${pr.chromatic?'Sí':'No'}</button></div>
      ${pr.chromatic?'':`<div class="cat-row" style="padding:4px 0 10px"><div class="grow">Comprobar octavación<div class="muted tsub">Al aire frente al traste 12, para ajustar el puente</div></div><button type="button" class="chip-btn${tunerOctave?' on':''}" id="tOctave" aria-pressed="${!!tunerOctave}">${tunerOctave?'Sí':'No'}</button></div>`}
      <div class="tuner-cal"><span class="muted grow">La de referencia</span><button type="button" id="tA4down" aria-label="Bajar La">−</button><button type="button" id="tA4" class="tuner-a4" aria-label="Volver a 440 Hz">${fmtNum(pr.a4)} Hz</button><button type="button" id="tA4up" aria-label="Subir La">+</button></div>
    </div>
    <div class="note mt3 mb0 mx1">El sonido se analiza en el dispositivo y no se guarda. Afina siempre subiendo hacia la nota.</div>`;
  const reset=()=>{tunerTuned.clear();tunerLock=null;tunerOctave=null;saveTunerPrefs();renderTuner()};
  const octStart=i=>{tunerLock=i;tunerOctave={...(tunerOctave||{results:{}}),s:i,step:'open',open:null,buf:[],waitQuiet:false};delete tunerOctave.results[i]};
  $$('[data-tinst]').forEach(b=>b.onclick=()=>{pr.instrument=b.dataset.tinst;reset()});
  $$('[data-tstrings]').forEach(b=>b.onclick=()=>{pr.strings={...pr.strings,[pr.instrument]:+b.dataset.tstrings};reset()});

  const bump=(i,d)=>{const c=[...tu.midis];c[i]=Math.max(12,Math.min(96,c[i]+d));pr.custom={...pr.custom,[combo]:c};tunerTuned.delete(i);saveTunerPrefs();renderTuner()};

  if($('#tOctave'))$('#tOctave').onclick=()=>{if(tunerOctave){tunerOctave=null;tunerLock=null}else{tunerOctave={results:{}};octStart(tunerLock??0)}renderTuner()};
  if($('#octExit'))$('#octExit').onclick=()=>{tunerOctave=null;tunerLock=null;renderTuner()};
  if($('#octAgain'))$('#octAgain').onclick=()=>{octStart(tunerOctave.s);renderTuner()};
  $$('[data-tview]').forEach(b=>b.onclick=()=>{pr.view=b.dataset.tview;saveTunerPrefs();renderTuner()});

  $('#tA4down').onclick=()=>setA4(Math.round(pr.a4)-1);$('#tA4up').onclick=()=>setA4(Math.round(pr.a4)+1);$('#tA4').onclick=()=>setA4(440);
  $('#tMic').onclick=()=>tuner?(stopTuner(),renderTuner()):startTuner();
  $('#tRef').onclick=()=>{const m=tuner?.target??(tunerLock!=null?tu.midis[tunerLock]:pr.chromatic?69:tu.midis[0]);playReference(m)};
  if($('#tAnalyze'))$('#tAnalyze').onclick=analyzeSongTuning;
  if($('#tApplySong'))$('#tApplySong').onclick=()=>{const p=tunerSongPlan();pr.strings={...pr.strings,[pr.instrument]:p.n};pr.tuning={...pr.tuning,[`${pr.instrument} ${p.n}`]:p.id};pr.a4=p.a4;pr.chromatic=false;toast(`Afinación: ${p.name} · La ${fmtNum(p.a4)} Hz`);reset()};
  paintTuner();
}

async function startTuner(){
  if(tuner)return;
  if(!navigator.mediaDevices?.getUserMedia)return toast('Este navegador no deja usar el micrófono');

// Avanza lo que haya pasado (también varios ejercicios si la app estuvo en segundo plano). Devuelve 'next', 'done' o ''.
function routineStep(run,items,now){
  let ev='';

    const goal=items[run.i].minutes*60,el=run.acc[run.i]+(now-run.t0)/1000;
    if(el<goal)break;

    if(run.i>=items.length){run.t0=null;ev='done'}
  }
  return ev;
}

// Paso i del compás (contando subdivisiones): qué suena y cuánto dura hasta el siguiente.
function metroStep(i,bpm,beats,sub,accent){
  const pos=i%(beats*sub),kind=pos%sub?'sub':accent&&pos===0?'accent':'beat';
  return {kind,beat:Math.floor(pos/sub),dt:60/bpm/sub};
}
// Tap tempo: media de los últimos intervalos parecidos a la mediana (descarta dobles toques y pausas).
function tapBpm(times){
  const kept=times.filter((t,i)=>i===0||t-times[i-1]>=200); // un toque a menos de 200 ms del anterior es un rebote
  const iv=[];for(let i=1;i<kept.length;i++){const d=kept[i]-kept[i-1];if(d<=2000)iv.push(d)}
  if(iv.length<2)return null;
  const last=iv.slice(-6),med=[...last].sort((a,b)=>a-b)[last.length>>1],ok=last.filter(d=>Math.abs(d-med)<=med*.15);
  return Math.round(60000/(ok.reduce((a,b)=>a+b,0)/ok.length));
}

function updateJob(value,text){
  if(!separatorJob)return;
  separatorJob.value=value;separatorJob.text=text;
  const bar=$('#jobBar'),label=$('#jobText');
  if(bar)bar.style.width=`${Math.round(value*100)}%`;
  if(label)label.textContent=text;

async function startSeparation(file){
  const name=file.name.replace(/\.[^.]+$/,'');
  separatorJob={name,value:0,text:'Leyendo audio…'};
  renderSongList();
  try{separatorJob.wakeLock=await navigator.wakeLock?.request('screen')}catch{}
  let audio;
  try{audio=await new OfflineAudioContext(2,1,44100).decodeAudioData(await file.arrayBuffer())}
  catch{finishJob();return toast('No se pudo leer ese audio')}
  const left=audio.getChannelData(0).slice(),right=(audio.numberOfChannels>1?audio.getChannelData(1):audio.getChannelData(0)).slice();
  const frames=left.length,worker=new Worker('separator-worker.js');
  separatorJob.worker=worker;
  worker.onmessage=async({data})=>{
    if(data.type==='progress'){
      if(data.phase==='download')updateJob(data.value*.1,`Descargando modelo… ${Math.round(data.value*100)}%`);
      else if(data.phase==='prepare')updateJob(.1,'Preparando IA…');
      else updateJob(.1+data.value*.9,`Separando… ${Math.round(data.value*100)}%${data.eta>5?` · quedan ~${fmtClock(data.eta)}`:''}${data.ep==='wasm'?' · CPU':''}`);
      return;
    }
    worker.terminate();
    if(data.type==='error'){finishJob();return toast(data.message==='download'||data.message==='hash'?'No se pudo descargar el modelo':'Error al separar la canción')}
    const stems={};let bytes=0;
    for(const [k,arr] of Object.entries(data.stems)){stems[k]=new Blob([arr]);bytes+=arr.byteLength}
    const song={id:uuid(),name,createdAt:new Date().toISOString(),frames,bpm:data.bpm||null,bytes,stems};
    try{await putSong(song)}catch{finishJob();return toast('No hay espacio para guardar las pistas')}
    const listShown=!!$('#songFile');
    finishJob();toast('Canción separada');if(listShown)openPlayer(song.id);
  };
  worker.onerror=()=>{finishJob();toast('Error al separar la canción')};
  worker.postMessage({type:'separate',left,right},[left.buffer,right.buffer]);
}
function finishJob(){
  separatorJob?.worker?.terminate();
  separatorJob?.wakeLock?.release?.().catch(()=>{});
  separatorJob=null;
  if($('#songFile'))renderSongList();
}
function cancelSeparation(){
  if(confirm('¿Cancelar la separación?'))finishJob();
}

// Mezcla las pistas activas en un WAV para un único <audio>: así el cambio de BPM usa el estirado
// de tiempo nativo del navegador (preservesPitch) y no cambia el tono.
function mixToWav(ratio=player.srcRatio){
  const p=player,n=p.song.frames*2,buf=new ArrayBuffer(44+n*2),dv=new DataView(buf);
  const str=(o,t)=>[...t].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
  str(0,'RIFF');dv.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);
  const sr=Math.round(44100*ratio);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);str(36,'data');dv.setUint32(40,n*2,true);
  const out=new Int16Array(buf,44),active=STEM_ORDER.map(k=>[p.data[k],stemGain(k)]).filter(([a,g])=>a&&g>0);
  for(let i=0;i<n;i++){let v=0;for(const [a,g] of active)v+=a[i]*g;out[i]=v>32767?32767:v<-32768?-32768:v}
  return new Blob([buf],{type:'audio/wav'});
}
// Mezcla por bloques (para el MP3): fija los volúmenes al empezar; devuelve (i,n) => [izq, der].
function mixFramesFn(){
  const p=player,active=STEM_ORDER.map(k=>[p.data[k],stemGain(k)]).filter(([a,g])=>a&&g>0),c=v=>v>32767?32767:v<-32768?-32768:v;
  return (i0,n)=>{const L=new Int16Array(n),R=new Int16Array(n);
    for(let j=0;j<n;j++){const o=(i0+j)*2;let l=0,r=0;for(const [a,g] of active){l+=a[o]*g;r+=a[o+1]*g}L[j]=c(l);R[j]=c(r)}
    return [L,R]};
}
// El conversor MP3 (lamejs, LGPL, archivo aparte) solo se carga la primera vez que se usa.
let lameLoading=null;
const loadLame=()=>lameLoading||(lameLoading=new Promise((ok,ko)=>{
  if(window.lamejs?.Mp3Encoder)return ok(window.lamejs);
  const sc=document.createElement('script');sc.src='lame.min.js';
  sc.onload=()=>window.lamejs?.Mp3Encoder?ok(window.lamejs):ko(new Error('lamejs'));sc.onerror=()=>{lameLoading=null;ko(new Error('lamejs'))};
  document.head.appendChild(sc);
}));
// Tono: el WAV se declara a 44100·r Hz (suena r veces más agudo y rápido) y playbackRate/r con preservesPitch
// devuelve el tempo sin tocar el tono. Por eso las posiciones se guardan en segundos de canción.
const songPos=()=>player.audio.currentTime*player.srcRatio;
const seekSong=t=>{player.audio.currentTime=t/player.srcRatio};
// MIX-START
// Nombre corto de la mezcla para el archivo: '' (todo igual), 'solo guitarra', 'sin guitarra y bajo', 'mezcla propia'…
function mixLabel(keys,solo,mute,vol,names){
  if(solo)return `solo ${names[solo].toLowerCase()}`;
  const off=keys.filter(k=>mute[k]||!(vol[k]>0)).map(k=>names[k].toLowerCase()),changed=keys.some(k=>!mute[k]&&vol[k]>0&&vol[k]!==1);
  const sin=off.length?`sin ${off.length>1?off.slice(0,-1).join(', ')+' y '+off.at(-1):off[0]}`:'';
  return [sin,changed?'mezcla propia':''].filter(Boolean).join(', ');
}
const safeFileName=n=>n.replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,80)||'cancion';
// MP3 estéreo 44,1 kHz con lamejs, por bloques para no congelar la pantalla. mix(i,n) = [izq, der] (Int16Array)
// de n muestras desde la i. Devuelve los trozos del archivo (para un Blob audio/mpeg).
async function encodeMp3(frames,mix,lame,{kbps=192,block=1152*40,tick=()=>new Promise(r=>setTimeout(r))}={},onProgress){
  const enc=new lame.Mp3Encoder(2,44100,kbps),parts=[];
  for(let i=0;i<frames;i+=block){
    const [l,r]=mix(i,Math.min(block,frames-i)),b=enc.encodeBuffer(l,r);
    if(b.length)parts.push(b);
    onProgress?.(Math.min(1,(i+block)/frames));await tick();
  }
  const f=enc.flush();if(f.length)parts.push(f);
  return parts;
}
const mp3SizeMB=(frames,kbps=192)=>frames/44100*kbps*125/1e6;
// MIX-END
async function exportMix(fmt='wav'){
  const p=player;if(!p||p.mp3Busy)return;
  if(fmt==='mp3'&&p.mp3){const r=await shareOrDownload(p.mp3);if(r==='error')toast('No se pudo guardar');else if(r==='ok')toast('MP3 guardado');return}
  const keys=STEM_ORDER.filter(k=>p.data[k]);
  if(!keys.some(k=>stemGain(k)>0))return toast('No suena ninguna pista');
  const label=mixLabel(keys,p.solo,p.mute,p.vol,Object.fromEntries(keys.map(k=>[k,STEM_INFO[k][0]])));
  const name=safeFileName(`${p.song.name}${label?` (${label})`:''}`)+'.'+fmt,btn=$(fmt==='mp3'?'#exportMp3':'#exportMix');
  if(btn){btn.disabled=true;btn.textContent='Preparando…'}
  await new Promise(r=>setTimeout(r,30)); // que se vea el aviso antes del cálculo
  if(fmt==='mp3'){
    let lame;try{lame=await loadLame()}catch{if($('#exportMp3'))renderPlayer();return toast('No se pudo cargar el conversor MP3')}
    p.mp3Busy=true;
    const parts=await encodeMp3(p.song.frames,mixFramesFn(),lame,{},f=>{const b=$('#exportMp3');if(b){b.disabled=true;b.textContent=`Convirtiendo… ${Math.round(f*100)} %`}});
    p.mp3Busy=false;if(player!==p)return;
    p.mp3=new File(parts,name,{type:'audio/mpeg'});
    if($('#exportMp3'))renderPlayer();
    return toast('MP3 listo: toca «Guardar MP3»');
  }
  const r=await shareOrDownload(new File([mixToWav(1)],name,{type:'audio/wav'}));
  if($('#exportMix'))renderPlayer();
  if(r==='error')return toast('No se pudo exportar');
  if(r==='ok')toast(p.semi||Math.round(p.target)!==p.song.bpm&&p.song.bpm?'Exportada al tempo y tono originales':'Mezcla exportada');
}
const stemGain=k=>player.solo?(player.solo===k?player.vol[k]:0):(player.mute[k]?0:player.vol[k]);

function applyRate(){
  const p=player,rate=Math.min(1.5,Math.max(.5,p.song.bpm?p.target/p.song.bpm:p.rate));
  p.audio.defaultPlaybackRate=p.audio.playbackRate=rate/p.srcRatio;
  p.audio.preservesPitch=true;p.audio.webkitPreservesPitch=true;
}
function remix(){
  const p=player,t=songPos(),playing=!p.audio.paused,old=p.url;
  if(p.mp3&&!p.mp3Busy)p.mp3=null;
  p.srcRatio=2**(p.semi/12);
  p.url=URL.createObjectURL(mixToWav());
  p.audio.src=p.url;
  p.audio.onloadedmetadata=()=>{seekSong(t);applyRate();if(playing)p.audio.play().catch(()=>{})};
  if(old)URL.revokeObjectURL(old);
}

async function openPlayer(id){
  if(player?.song.id===id)return renderPlayer();
  const song=(await listSongs()).find(s=>s.id===id);
  if(!song){renderSongList();return toast('Esa canción ya no está guardada')}
  stopPlayer();
  $('#stemsBody').innerHTML='<div class="card empty">Cargando pistas…</div>';
  const data={};
  for(const [k,b] of Object.entries(song.stems))data[k]=new Int16Array(await b.arrayBuffer());
  player={song,data,audio:new Audio(),url:null,vol:Object.fromEntries(STEM_ORDER.map(k=>[k,1])),mute:{},solo:null,target:song.bpm||100,rate:1,practice:new Map(),lastTick:null,loop:null,semi:0,srcRatio:1,takes:[],takeN:0,rec:null};
  player.audio.ontimeupdate=()=>{checkLoop();paintSectionHere();paintChordNow();const r=$('#seek');if(r&&!r.matches(':active')){const t=songPos();r.value=t;$('#curTime').textContent=fmtClock(t)}};
  // Bucle que llega al final de la canción: el audio se para solo; se vuelve al inicio del bucle.
  player.audio.onended=()=>{if(player?.rec?.stage==='rec')return recStop();if(player?.rec)return;const l=player?.loop;if(l?.b!=null){seekSong(l.a);player.audio.play().catch(()=>{});loopLap()}};
  player.audio.onplay=player.audio.onpause=()=>{if(!player.audio.paused)player.unlocked=true;practiceTick();paintPlayBtn();syncMini();syncPlaybackNotice()};
  remix();renderPlayer();renderHome();renderPlay();
}

// ---------- Cuenta atrás: un compás (4 clics) al tempo de práctica y la canción entra en el siguiente tiempo ----------
const COUNT_KEY=PREVIEW?'practica_preview_countin':'practica_countin_v1';
let countInOn=(()=>{try{return localStorage.getItem(COUNT_KEY)==='1'}catch{return false}})();
const paintPlayBtn=()=>{const b=$('#playBtn');if(b&&player)b.textContent=player.count?String(player.count.n):player.audio.paused?'▶':'❚❚'};
function countCancel(){
  const p=player,c=p?.count;if(!c)return;
  c.timers.forEach(clearTimeout);c.ctx.close?.().catch(()=>{});p.count=null;c.onCancel?.();paintPlayBtn();
}
// go() arranca la canción. Sin BPM, con la cuenta apagada o si ya suena: al momento. Tocar otra vez durante la cuenta la cancela.
function withCountIn(go,onCancel){
  const p=player;if(!p)return;
  if(p.count)return countCancel();
  if(!countInOn||!p.song.bpm||!p.audio.paused)return go();
  const a=p.audio,pos=songPos(),ctx=new (window.AudioContext||window.webkitAudioContext)(),beat=60/p.target,lead=.1;
  ctx.resume?.().catch(()=>{});
  const c=p.count={n:4,ctx,onCancel,timers:[],started:false};
  // iPhone solo deja sonar el audio desde un toque: se desbloquea ahora en silencio y vuelve a su sitio.
  if(!p.unlocked){a.muted=true;a.play().then(()=>{if(!c.started){a.pause();seekSong(pos)}a.muted=false}).catch(()=>{a.muted=false})}
  for(let i=0;i<4;i++){
    metroClick(ctx,ctx.currentTime+lead+i*beat,i?'beat':'accent');
    c.timers.push(setTimeout(()=>{if(p.count===c){c.n=4-i;paintPlayBtn()}},(lead+i*beat)*1000));
  }
  // shortcut: entra 40 ms antes para cubrir el arranque del audio; si se nota tarde en algún móvil, medirlo como la sincronía de grabación.
  c.timers.push(setTimeout(()=>{
    if(p.count!==c)return;
    c.started=true;p.count=null;a.muted=false;if(!a.paused)a.pause();seekSong(pos);go();paintPlayBtn();
    setTimeout(()=>ctx.close?.().catch(()=>{}),500);
  },(lead+4*beat)*1000-40));
  paintPlayBtn();
}

// ---------- Bucle: 1.er toque = inicio, 2.º = cierra y repite, 3.º = quita ----------
function loopTap(){
  const p=player;if(!p)return;
  const t=songPos();
  if(!p.loop)p.loop={a:t,b:null};
  else if(p.loop.b==null){
    if(t-p.loop.a<0.5)return toast('Avanza un poco más para cerrar el bucle');
    p.loop.b=t;seekSong(p.loop.a);
  }else p.loop=null;
  paintLoop();
}
function paintLoop(){
  const p=player,b=$('#loopBtn');
  if(p.loop?.b==null)p.trainer=null;
  renderTrainer();if(b){b.innerHTML=loopLabel();b.classList.toggle('on',!!p.loop);b.setAttribute('aria-pressed',!!p.loop)}
  if($('#sectionRow'))renderSections();
  renderRecBox();
}
function checkLoop(){
  const r=player?.rec;
  if(r?.stage==='play')return; // escuchando una toma: la canción sigue de largo
  if(r?.stage==='rec'){if(r.loop&&songPos()>=r.loop.b)recStop();return} // se graba una sola vuelta del bucle
  const l=player?.loop;
  if(l?.b==null)return;
  const t=songPos();
  if(t>=l.b){seekSong(l.a);loopLap()}
  else if(t<l.a-0.5)seekSong(l.a);
}
const loopLabel=()=>{const l=player.loop;return !l?`${ic('repeat')} Bucle: marcar inicio`:l.b==null?`${ic('repeat')} Cerrar bucle (desde ${fmtClock(l.a)})`:`${ic('repeat')} Bucle ${fmtClock(l.a)} – ${fmtClock(l.b)} · quitar`};

// ---------- Entrenador de velocidad: con el bucle cerrado, sube el BPM cada N vueltas hasta el objetivo ----------
// TRAINER-START
// Cuenta una vuelta y devuelve el BPM de práctica que toca (el mismo si aún no toca subir o ya está en el objetivo).
function trainerLap(tr,bpm){
  tr.laps++;
  if(tr.laps%tr.every||bpm>=tr.goal)return bpm;
  return Math.min(tr.goal,Math.round(bpm)+tr.step);
}
// TRAINER-END
function loopLap(){
  const p=player,tr=p?.trainer;if(!tr?.on)return renderTrainer();
  const bpm=trainerLap(tr,p.target);
  if(bpm!==p.target){practiceTick();p.target=bpm;applyRate();renderPlayer();toast(bpm>=tr.goal?`Objetivo alcanzado: ${bpm} BPM`:`▲ ${bpm} BPM`)}
  if(bpm>=tr.goal)p.trainer=null;
  renderTrainer();
}
function renderTrainer(){
  const p=player,box=$('#trainerBox');if(!box)return;
  const s=p.song,tr=p.trainer;
  if(p.loop?.b==null||!s.bpm){box.innerHTML='';return}
  if(!tr){box.innerHTML=`<button type="button" class="secondary wide mt2" id="trainerOpen">${ic('speed')} Entrenador de velocidad</button>`;
    $('#trainerOpen').onclick=()=>{const now=Math.round(p.target),max=Math.floor(s.bpm*1.5);
      p.trainer={step:2,every:4,goal:now<s.bpm?s.bpm:Math.min(max,now+10),laps:0,on:false};renderTrainer()};return}
  const row=(k,label,unit)=>`<div class="tuner-cal mt2"><span class="grow note">${label}</span><button type="button" data-tr="${k}" data-d="-1" aria-label="Menos">−</button><b class="tuner-a4" style="text-align:center">${tr[k]} ${unit}</b><button type="button" data-tr="${k}" data-d="1" aria-label="Más">+</button></div>`;
  box.innerHTML=`<div class="card" style="margin-top:8px;background:var(--card2)">${tr.on
    ?`<div class="cat-row" style="border:0;padding:0"><div class="grow"><strong>Entrenador en marcha</strong><div class="muted tsub">Vuelta ${tr.laps%tr.every+1} de ${tr.every} · +${tr.step} BPM hasta ${tr.goal}</div></div><strong style="color:var(--accent)">${Math.round(p.target)} BPM</strong></div>
      <button type="button" class="secondary wide mt3" id="trainerStop">Parar</button>`
    :`${row('step','Sube','BPM')}${row('every','Cada','vueltas')}${row('goal','Hasta','BPM')}
      <div class="block-actions mt3"><button type="button" class="secondary" id="trainerCancel">Cancelar</button><button type="button" class="primary" id="trainerStart">Empezar</button></div>`}</div>`;
  const lim={step:[1,10],every:[1,16],goal:[Math.round(p.target)+1,Math.floor(s.bpm*1.5)]};
  $$('[data-tr]').forEach(b=>b.onclick=()=>{const k=b.dataset.tr,[lo,hi]=lim[k];tr[k]=Math.max(lo,Math.min(hi,tr[k]+ +b.dataset.d*(k==='goal'?5:1)));renderTrainer()});
  if($('#trainerCancel'))$('#trainerCancel').onclick=()=>{p.trainer=null;renderTrainer()};
  if($('#trainerStart'))$('#trainerStart').onclick=()=>{
    if(tr.goal<=Math.round(p.target))return toast('El objetivo tiene que ser mayor que el BPM actual');
    tr.on=true;tr.laps=0;if(p.count)countCancel();seekSong(p.loop.a);withCountIn(()=>p.audio.play().catch(()=>{}));renderTrainer()};
  if($('#trainerStop'))$('#trainerStop').onclick=()=>{p.trainer=null;renderTrainer()};
}

// ---------- Grabarse sobre la pista: tomas con el micro mientras suena la canción ----------
// REC-START
// Formato que el navegador sabe grabar (iPhone: mp4/AAC; Chrome/Android: webm/Opus).
const pickRecMime=ok=>['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'].find(m=>ok(m))||'';
const recExt=m=>m.includes('mp4')?'m4a':m.includes('ogg')?'ogg':'webm';
// Arranque de toma y canción: con desfase positivo (la toma llega tarde) la toma empieza antes; devuelve ms de espera de cada una.
const recDelays=ms=>ms>=0?{take:0,song:ms}:{take:-ms,song:0};
// REC-END
const REC_LAT_KEY=PREVIEW?'practica_preview_rec_latency':'practica_rec_latency_v1';
let recLatency=0;try{recLatency=Math.max(-500,Math.min(500,+localStorage.getItem(REC_LAT_KEY)||0))}catch{}
async function recStart(){
  const p=player;if(!p||p.rec)return;
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('Este navegador no puede grabar');
  stopTuner();metroStop();scalePlayStop();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}})}
  catch(err){return toast(err?.name==='NotAllowedError'?'Sin permiso de micrófono: actívalo en los ajustes':'No se pudo abrir el micrófono')}
  if(player!==p){stream.getTracks().forEach(t=>t.stop());return}
  const mime=pickRecMime(m=>MediaRecorder.isTypeSupported(m)),mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];
  const loop=p.loop?.b!=null?{a:p.loop.a,b:p.loop.b}:null;
  if(loop)seekSong(loop.a);
  const rec={stage:'count',mr,loop,start:songPos(),end:null};
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:mr.mimeType||mime||'audio/webm'});
    if(blob.size&&player===p)p.takes.unshift({id:uuid(),n:++p.takeN,blob,url:URL.createObjectURL(blob),start:rec.start,dur:Math.max(0,(rec.end??songPos())-rec.start),target:p.target,semi:p.semi});
    if(p.rec===rec)p.rec=null;
    if(player===p)renderRecBox();
  };
  p.rec=rec;
  withCountIn(()=>{rec.stage='rec';rec.start=songPos();mr.start();p.audio.play().catch(()=>{});renderRecBox()},
    ()=>{stream.getTracks().forEach(t=>t.stop());if(p.rec===rec)p.rec=null;renderRecBox()});
  renderRecBox();
}
function recStop(){
  const p=player,r=p?.rec;if(r?.stage==='count')return countCancel();
  if(r?.stage!=='rec'||r.mr.state!=='recording')return;
  r.end=songPos();p.audio.pause();r.mr.stop();
}
async function takePlay(id,withSong){
  const p=player,t=p.takes.find(x=>x.id===id);if(!t)return;
  takeStop();
  if(Math.round(t.target)!==Math.round(p.target)){practiceTick();p.target=t.target;applyRate();toast(`Tempo de la toma: ${Math.round(t.target)} BPM`)}
  else if(t.semi!==p.semi)toast(`La toma se grabó con el tono a ${t.semi>0?'+':''}${t.semi}`);
  const a=new Audio(t.url),rec={stage:'play',take:a,id:t.id,withSong,timers:[]};
  p.rec=rec;a.onended=()=>{if(p.rec===rec)takeStop()};
  p.audio.pause();if(withSong)seekSong(t.start);
  const d=recDelays(withSong?recLatency:0);
  rec.timers.push(setTimeout(()=>a.play().catch(()=>{}),d.take));
  if(withSong)rec.timers.push(setTimeout(()=>p.audio.play().catch(()=>{}),d.song));
  renderRecBox();
}
function takeStop(){
  const p=player,r=p?.rec;if(r?.stage!=='play')return;
  r.timers.forEach(clearTimeout);r.take.pause();if(r.withSong)p.audio.pause();
  p.rec=null;renderRecBox();
}
function renderRecBox(){
  const p=player,box=$('#recBox');if(!box)return;
  const r=p.rec,loop=p.loop?.b!=null;
  box.innerHTML=(r?.stage==='rec'||r?.stage==='count'
    ?`<button type="button" class="danger wide mt2" id="recBtn">■ ${r.stage==='count'?'Cancelar':`Parar grabación${r.loop?' (para sola al final del bucle)':''}`}</button>`
    :`<button type="button" class="secondary wide" id="recBtn" style="margin-top:8px" ${r?'disabled':''}>● Grabarme${loop?' (una vuelta del bucle)':''}</button>`)+
    (p.takes.length?`<div class="card" style="margin-top:8px;background:var(--card2)">${p.takes.map(t=>{const on=r?.stage==='play'&&r.id===t.id;return `<div class="cat-row" style="padding:8px 0;gap:6px"><div class="grow" style="min-width:0"><strong>Toma ${t.n}</strong><div class="muted tsub">${fmtClock(t.dur)} · desde ${fmtClock(t.start)} · ${Math.round(t.target)} BPM</div></div>
      ${on?'<button type="button" class="icon-btn" data-take-stop aria-label="Parar">■</button>':`<button type="button" class="icon-btn" data-take-song="${t.id}" aria-label="Escuchar con la canción" title="Con la canción">▶♫</button><button type="button" class="icon-btn" data-take-solo="${t.id}" aria-label="Escuchar solo la toma" title="Solo la toma">▶</button>`}
      <button type="button" class="icon-btn" data-take-save="${t.id}" aria-label="Guardar la toma">⤓</button><button type="button" class="icon-btn" data-take-del="${t.id}" aria-label="Borrar la toma">✕</button></div>`}).join('')}
      <div class="tuner-cal mt2"><span class="grow note">Sincronía (si te oyes tarde, súbela)</span><button type="button" data-lat="-10" aria-label="Menos">−</button><b class="tuner-a4" style="text-align:center">${recLatency} ms</b><button type="button" data-lat="10" aria-label="Más">+</button></div>
      <div class="note mt2">Las tomas se borran al cerrar la canción; guarda las que quieras con ⤓. Con auriculares se oye mejor.</div></div>`:'');
  $('#recBtn').onclick=()=>r?.stage==='rec'||r?.stage==='count'?recStop():recStart();
  $$('[data-take-song]').forEach(b=>b.onclick=()=>takePlay(b.dataset.takeSong,true));
  $$('[data-take-solo]').forEach(b=>b.onclick=()=>takePlay(b.dataset.takeSolo,false));
  $$('[data-take-stop]').forEach(b=>b.onclick=takeStop);
  $$('[data-take-del]').forEach(b=>b.onclick=()=>{const t=p.takes.find(x=>x.id===b.dataset.takeDel);if(p.rec?.id===t.id)takeStop();URL.revokeObjectURL(t.url);p.takes=p.takes.filter(x=>x!==t);renderRecBox()});
  $$('[data-take-save]').forEach(b=>b.onclick=async()=>{const t=p.takes.find(x=>x.id===b.dataset.takeSave);
    const r2=await shareOrDownload(new File([t.blob],`${safeFileName(p.song.name)} - toma ${t.n}.${recExt(t.blob.type)}`,{type:t.blob.type}));if(r2==='error')toast('No se pudo guardar')});
  $$('[data-lat]').forEach(b=>b.onclick=()=>{recLatency=Math.max(-500,Math.min(500,recLatency+ +b.dataset.lat));try{localStorage.setItem(REC_LAT_KEY,recLatency)}catch{}renderRecBox()});
}

// ---------- Secciones con nombre: un toque salta a la sección y la repite en bucle ----------
// SECTIONS-START
const SECTION_NAMES=['Intro','Estrofa','Pre','Estribillo','Estrofa 2','Estribillo 2','Puente','Solo','Estribillo final','Final'];
// Sección i (lista ordenada por t): de su inicio al de la siguiente o al final de la canción.
const sectionRange=(list,i,dur)=>({a:list[i].t,b:i+1<list.length?list[i+1].t:dur});
function sectionAt(list,t){let k=-1;list.forEach((s,i)=>{if(t>=s.t-0.05)k=i});return k}
// Añade en t (redondeado a 0,1 s); si ya hay una a menos de 1 s, la renombra en vez de duplicarla.
function addSection(list,name,t){
  const out=list.map(s=>({...s})),near=out.findIndex(s=>Math.abs(s.t-t)<1);
  if(near>=0)out[near].name=name;else out.push({name,t:Math.round(t*10)/10});
  return out.sort((a,b)=>a.t-b.t);
}
// SECTIONS-END
const songDur=()=>player.song.frames/44100;
function sectionLooped(i){
  const l=player.loop,r=sectionRange(player.song.sections,i,songDur());
  return l?.b!=null&&Math.abs(l.a-r.a)<.05&&Math.abs(l.b-r.b)<.05;
}
function renderSections(){
  const p=player,l=p.song.sections||[],row=$('#sectionRow');if(!row)return;
  row.innerHTML=l.map((s,i)=>`<button type="button" class="chip-btn${sectionLooped(i)?' on':''}" data-section="${i}" aria-pressed="${sectionLooped(i)}">${p.editSections?'✎ ':''}${esc(s.name)} <span class="muted">${fmtClock(s.t)}</span></button>`).join('')+
    (p.editSections?'':'<button type="button" class="chip-btn" id="addSection">+ Sección aquí</button>')+
    (l.length?`<button type="button" class="chip-btn${p.editSections?' on':''}" id="editSections">${p.editSections?'Listo':'Editar'}</button>`:'');
  paintSectionHere();
  $$('[data-section]').forEach(b=>b.onclick=()=>sectionTap(+b.dataset.section));
  if($('#addSection'))$('#addSection').onclick=addSectionHere;
  if($('#editSections'))$('#editSections').onclick=()=>{p.editSections=!p.editSections;renderSections()};
}
function paintSectionHere(){
  const l=player?.song.sections;if(!l?.length)return;
  const k=sectionAt(l,songPos());$$('[data-section]').forEach(b=>b.classList.toggle('here',+b.dataset.section===k));
}
async function sectionTap(i){
  const p=player,s=p.song,l=s.sections;
  if(p.editSections){
    const name=prompt('Nombre de la sección (vacío = borrarla)',l[i].name);if(name==null)return;
    if(name.trim())l[i].name=name.trim().slice(0,30);else l.splice(i,1);
    if(!l.length)p.editSections=false;
    await putSong(s);return renderSections();
  }
  if(sectionLooped(i)){p.loop=null;return paintLoop()}
  const r=sectionRange(l,i,songDur());
  if(r.b-r.a<0.5)return toast('Sección demasiado corta para repetirla');
  if(p.count)countCancel();
  p.loop=r;seekSong(r.a);paintLoop();
  withCountIn(()=>p.audio.play().catch(()=>{}));
}
async function addSectionHere(){
  const p=player,s=p.song,l=s.sections||[],t=songPos();
  const def=SECTION_NAMES[l.length]||`Sección ${l.length+1}`;
  const name=prompt(`Nombre de la sección que empieza en ${fmtClock(t)}`,def);if(name==null)return;
  s.sections=addSection(l,name.trim().slice(0,30)||def,t);
  await putSong(s);renderSections();
}

// ---------- Aviso "Práctica en curso" en la pantalla de bloqueo ----------
// Se publica al ocultarse la app (al bloquear), no al pulsar play: algunos móviles (Xiaomi) no enseñan en el
// bloqueo las notificaciones creadas con la pantalla encendida porque las dan por vistas.
const PLAY_NOTICE_TAG='practica-reproduccion';
const askNoticePermission=()=>{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})};
async function syncPlaybackNotice(){
  const reg=await navigator.serviceWorker?.getRegistration().catch(()=>null);
  if(!reg?.showNotification)return;
  (await reg.getNotifications({tag:PLAY_NOTICE_TAG}).catch(()=>[])).forEach(n=>n.close());
  const p=player;
  if(!p||p.audio.paused||document.visibilityState!=='hidden'||Notification.permission!=='granted')return;
  reg.showNotification('Práctica en curso',{tag:PLAY_NOTICE_TAG,body:`${p.song.name}${p.song.bpm?` · ${Math.round(p.target)} BPM`:''}`,icon:'icons/icon-192.png',badge:'icons/icon-192.png',silent:true}).catch(()=>{});
}
document.addEventListener('visibilitychange',syncPlaybackNotice);

// ---------- Modo práctica con canción ----------
let sessionFromPlayer=false;
const practiceSeconds=()=>player?[...player.practice.values()].reduce((a,b)=>a+b,0):0;
const practiceText=()=>fmtClock(practiceSeconds());
// Acumula el tiempo sonando desde el último tick en el BPM de práctica actual (0 = BPM desconocido).
function practiceTick(){
  const p=player;if(!p)return;
  const now=performance.now();
  if(p.lastTick!=null){const k=p.song.bpm?Math.round(p.target):0;p.practice.set(k,(p.practice.get(k)||0)+(now-p.lastTick)/1000)}
  p.lastTick=p.audio.paused||p.rec?.stage==='play'?null:now; // escuchar una toma no cuenta como práctica
}
function stopPlayer(){
  if(!player)return;
  countCancel();
  // Quitar los avisos antes de pausar: el evento 'pause' llega cuando player ya es null.
  player.audio.onplay=player.audio.onpause=player.audio.ontimeupdate=player.audio.onended=null;
  if(player.rec?.stage==='rec')player.rec.mr.stop();else if(player.rec)player.rec.take.pause();
  player.takes.forEach(t=>URL.revokeObjectURL(t.url));
  player.audio.pause();if(player.url)URL.revokeObjectURL(player.url);
  player=null;syncMini();syncPlaybackNotice();renderHome();renderPlay();
}
function syncMini(){
  const m=$('#miniPlayer'),p=player,inPlayer=$('#toolModal').classList.contains('open')&&!!$('#playBtn');
  const show=!!p&&!inPlayer;
  m.hidden=!show;document.body.classList.toggle('has-mini',show);
  const now=$('#practiceNow');if(now&&p)now.textContent=practiceText();
  if(!show)return;
  $('#miniTitle').textContent=p.song.name;
  $('#miniSub').textContent=`${p.song.bpm?`${Math.round(p.target)} BPM · `:''}${practiceText()} de práctica`;
  $('#miniPlay').textContent=p.audio.paused?'▶':'❚❚';
}
function songExercise(song){
  const all=exercises();
  let e=all.find(x=>x.songId===song.id)||all.find(x=>x.name.toLowerCase()===song.name.toLowerCase());
  if(!e){e={id:uuid(),name:song.name,category:'Repertorio',variants:[],createdAt:new Date().toISOString()};all.push(e)}
  e.songId=song.id;saveExercises(all);
  return e;
}
function logPracticeFromPlayer(){
  practiceTick();
  const p=player,secs=practiceSeconds();
  if(secs<30)return toast('Toca un poco más: aún no hay tiempo de práctica');
  const e=songExercise(p.song);
  const blocks=[...p.practice].filter(([bpm,t])=>bpm>0&&t>=15).map(([bpm,t])=>({bpm,minutes:t>=60?Math.round(t/60):''}));
  const off=STEM_ORDER.filter(k=>p.solo?p.solo!==k:p.mute[k]).map(k=>STEM_INFO[k][0].toLowerCase());
  sessionFromPlayer=true;
  openSessionModal();
  refreshExercisePicker();$('#exercisePicker').value=e.id;chooseExercise();
  $('#practiceMinutes').value=Math.max(1,Math.round(secs/60));
  if(p.mute.guitar||p.mute.bass){instrument=p.mute.bass&&!p.mute.guitar?'Bajo':'Guitarra';renderInstrument()}
  blocks.forEach(b=>addTempoRow(b.bpm,b.minutes));
  // Los minutos redondeados de los bloques no pueden superar el total.
  const total=+$('#practiceMinutes').value,assigned=blocks.reduce((n,b)=>n+(+b.minutes||0),0);
  if(assigned>total)$('#practiceMinutes').value=assigned;
  $('#notes').value=`Con el separador de pistas${off.length?` (sin ${off.join(', ')})`:''}.`;
  updateTotal();
}

<script>
if (PREVIEW && 'serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
} else if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      await reg.update();
    } catch (err) {
      console.error(err);
    }
  });
}
</script>
