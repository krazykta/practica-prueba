<script>
const categories=['Escalas','Acordes','Técnica','Improvisación','Repertorio','Calentamiento'];
const categoryColors={Escalas:'#4EEE7C',Acordes:'#FFD166','Técnica':'#4DA3FF','Improvisación':'#B276FF',Repertorio:'#FF6B7A',Calentamiento:'#FF9F43'};
const catColor=c=>categoryColors[c]||'#9AA2A2';
const warmups=['Sin calentamiento','Movilidad','Cromáticos','Digitación','Independencia de dedos','Técnica','Estiramientos suaves','Personalizado'];
// PREVIEW=true usa claves aisladas y no registra Service Worker. Poner false SOLO al publicar.
const PREVIEW=false;
const SESSIONS_KEY=PREVIEW?'practica_preview_sessions':'practica_sessions_v2';
const EXERCISES_KEY=PREVIEW?'practica_preview_exercises':'practica_exercises_v2';
const GOALS_KEY=PREVIEW?'practica_preview_goals':'practica_goals_v1';
const defaultGoals={dailyMinutes:120,weeklyDays:5,weeklyMinutes:600};
const goals=()=>{
  try{
    const raw={...defaultGoals,...JSON.parse(localStorage.getItem(GOALS_KEY)||'{}')};
    raw.dailyMinutes=Math.max(15,+raw.dailyMinutes||120);
    raw.weeklyDays=Math.min(7,Math.max(1,+raw.weeklyDays||5));
    raw.weeklyMinutes=Math.round(raw.dailyMinutes*raw.weeklyDays);
    return raw;
  }catch{
    return {...defaultGoals};
  }
};
const saveGoals=g=>{
  const clean={
    dailyMinutes:Math.max(15,+g.dailyMinutes||120),
    weeklyDays:Math.min(7,Math.max(1,+g.weeklyDays||5))
  };
  clean.weeklyMinutes=Math.round(clean.dailyMinutes*clean.weeklyDays);
  localStorage.setItem(GOALS_KEY,JSON.stringify(clean));
};
const instruments=['Guitarra','Bajo'];
const instrumentOf=s=>s?.instrument==='Bajo'?'Bajo':'Guitarra';
let instrument='Guitarra', statInstrument='all';
let difficulty=3, statPeriod='week', viewMonth=new Date(), selectedDate=new Date(), editingSessionId=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uuid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;
let sessionStore=(()=>{try{return JSON.parse(localStorage.getItem(SESSIONS_KEY)||'[]')}catch{return[]}})();
let exerciseStore=(()=>{try{return JSON.parse(localStorage.getItem(EXERCISES_KEY)||'[]')}catch{return[]}})();

const sessions=()=>[...sessionStore].sort((a,b)=>new Date(b.date)-new Date(a.date));
const exercises=()=>[...exerciseStore].sort((a,b)=>a.name.localeCompare(b.name,'es'));

const saveSessions=a=>{
  sessionStore=[...a];
  try{localStorage.setItem(SESSIONS_KEY,JSON.stringify(sessionStore))}catch{}
};
const saveExercises=a=>{
  exerciseStore=[...a];
  try{localStorage.setItem(EXERCISES_KEY,JSON.stringify(exerciseStore))}catch{}
};
const fmt=m=>{m=Math.max(0,Math.round(m||0));const h=Math.floor(m/60),r=m%60;return h?(r?`${h} h ${r} min`:`${h} h`):`${r} min`};
const startDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const sameDay=(a,b)=>isoDay(new Date(a))===isoDay(new Date(b));
const sessionExercise=s=>exercises().find(e=>e.id===s.exerciseId)||{id:s.exerciseId||'',name:s.exerciseName||'Sin nombre',category:s.category||'Otros'};

function migrateV1(){
  if(PREVIEW||localStorage.getItem(SESSIONS_KEY))return;
  try{
    const old=JSON.parse(localStorage.getItem('practica_sessions_v1')||'[]');
    if(!old.length)return;
    const ex=[]; const byName={};
    const upgraded=old.map(s=>{
      const key=(s.topic||'Sin nombre').trim().toLowerCase();
      let e=byName[key];
      if(!e){
        e={
          id:uuid(),
          name:(s.topic||'Sin nombre').trim(),
          category:s.category||'Técnica',
          variants:[],
          createdAt:s.date||new Date().toISOString()
        };
        byName[key]=e;
        ex.push(e);
      }
      return {
        ...s,
        exerciseId:e.id,
        exerciseName:e.name,
        category:e.category,
        variantId:'',
        variantName:'',
        tempoBlocks:[]
      };
    });
    saveExercises(ex);
    saveSessions(upgraded);
  }catch{}
}

function ensureExercise(name,category){
  const clean=name.trim(); const all=exercises();
  let e=all.find(x=>x.name.toLowerCase()===clean.toLowerCase());
  if(e){ if(category&&e.category!==category){e.category=category;saveExercises(all)} return e; }
  e={id:uuid(),name:clean,category,variants:[],createdAt:new Date().toISOString()}; all.push(e);saveExercises(all);return e;
}

function renderAll(){renderHome();renderStats();renderHistory();renderMore();refreshExerciseDatalist();refreshExercisePicker()}

function renderHome(){
  const a=sessions(), now=new Date(), today=a.filter(s=>sameDay(s.date,now));
  const todayMin=today.reduce((n,s)=>n+(+s.practiceMinutes||0),0), goal=Math.max(1,+goals().dailyMinutes||120);
  const weekStart=new Date(now); weekStart.setDate(now.getDate()-((now.getDay()+6)%7)); weekStart.setHours(0,0,0,0);
  const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+7);
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1), monthEnd=new Date(now.getFullYear(),now.getMonth()+1,1);
  const sum=(from,to)=>a.filter(s=>new Date(s.date)>=from&&new Date(s.date)<to).reduce((n,s)=>n+(+s.practiceMinutes||0),0);
  const days=new Set(a.map(s=>isoDay(new Date(s.date)))); let streak=0,c=startDay(now); if(!days.has(isoDay(c))){c.setDate(c.getDate()-1)} while(days.has(isoDay(c))){streak++;c.setDate(c.getDate()-1)}
  const weekDays=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d});
  const latest=today.length?today:a.slice(0,3);
  $('#home').innerHTML=`
    <div class="eyebrow">${now.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</div><div class="title">Hoy</div>
    <div class="week">${weekDays.map(d=>`<div class="day ${sameDay(d,now)?'today':''} ${days.has(isoDay(d))?'done':''}">${d.toLocaleDateString('es-ES',{weekday:'narrow'})}<b>${d.getDate()}</b><i></i></div>`).join('')}</div>
    <div class="ring-wrap"><div class="ring" style="--p:${Math.min(100,todayMin/goal*100)}"><div class="inside"><div class="big">${fmt(todayMin)}</div><div class="small">de práctica</div><div class="small">Objetivo: ${fmt(goal)}</div></div></div></div>
    <div class="stats3"><div class="mini"><span>Esta semana</span><strong>${fmt(sum(weekStart,weekEnd))}</strong></div><div class="mini accent"><span>Racha</span><strong>${streak} días</strong></div><div class="mini"><span>Este mes</span><strong>${fmt(sum(monthStart,monthEnd))}</strong></div></div>
    <div class="quick-row">
      ${a.length?`<button class="quick" id="quickRepeat" type="button"><i>↻</i>Repetir última</button>`:`<button class="quick" id="quickNew" type="button"><i>+</i>Nueva práctica</button>`}
      <button class="quick" id="quickSong" type="button"><i>♫</i>${player?'Continuar canción':'Con canción'}</button>
      <button class="quick" id="quickScales" type="button"><i>◈</i>Escalas</button>
    </div>
    <div class="section-title">${today.length?'Prácticas de hoy':'Últimas prácticas'}</div>
    ${latest.length?latest.map(sessionCard).join(''):`<div class="card empty">Todavía no hay prácticas. Pulsa + para registrar la primera.</div>`}`;
  bindSessionCards();
  if($('#quickRepeat'))$('#quickRepeat').onclick=()=>repeatSession(a[0].id);
  if($('#quickNew'))$('#quickNew').onclick=()=>openSessionModal();
  $('#quickSong').onclick=()=>openStems(player?.song.id);
  $('#quickScales').onclick=openScales;
}

function sessionCard(s){
  const e=sessionExercise(s),blocks=s.tempoBlocks||[],legacyVariant=variantNameForSession(s,e);

  const groups=[];
  const byKey=new Map();

  blocks.forEach((b,index)=>{
    const variant=blockVariantName(b,e)||legacyVariant||'';
    const key=variant?(b.variantId||`name:${variant.toLowerCase()}`):'__no_variant__';

    if(!byKey.has(key)){
      const group={key,name:variant,blocks:[],firstIndex:index};
      byKey.set(key,group);
      groups.push(group);
    }
    byKey.get(key).blocks.push(b);
  });

  return `<div class="card session" data-session="${esc(s.id)}">
    <div class="dot" style="background:${catColor(e.category)}">♪</div>
    <div class="main">
      <h4>${esc(e.name)}</h4>
      <p><span class="cat-badge" style="--cat:${catColor(e.category)}">${esc(e.category)}</span> · ${instrumentOf(s)} · ${fmt(s.practiceMinutes)}</p>
      ${s.warmupMinutes?`<p>Calentamiento · ${fmt(s.warmupMinutes)}</p>`:''}
      ${groups.length?`<div class="variant-groups">${groups.map(g=>`
        <div class="variant-group">
          ${g.name?`<div class="variant-name">${esc(g.name)}</div>`:''}
          <div class="variant-blocks">
            ${g.blocks.map(b=>`
              <span class="tempo-chip-rich">
                <span class="tempo-bpm">${b.bpm} BPM</span>
                ${b.minutes!=null&&+b.minutes>0?`<span class="tempo-sep">·</span><span class="tempo-time">${fmt(b.minutes)}</span>`:''}
              </span>`).join('')}
          </div>
        </div>`).join('')}</div>`:''}
    </div>
    <div class="chev">›</div>
  </div>`;
}
function bindSessionCards(){$$('[data-session]').forEach(el=>el.onclick=()=>openSessionDetail(el.dataset.session))}

// STATS-START
const sumMin=list=>list.reduce((n,s)=>n+(+s.practiceMinutes||0),0);
const dayDiff=(a,b)=>Math.round((startDay(b)-startDay(a))/864e5);
function bestStreak(daySet){
  let best=0,cur=0,prev=null;
  [...daySet].sort().forEach(k=>{const d=new Date(k+'T00:00');cur=prev&&dayDiff(prev,d)===1?cur+1:1;best=Math.max(best,cur);prev=d});
  return best;
}
function currentStreak(daySet,now=new Date()){
  let n=0,c=startDay(now);if(!daySet.has(isoDay(c)))c.setDate(c.getDate()-1);
  while(daySet.has(isoDay(c))){n++;c.setDate(c.getDate()-1)}
  return n;
}
// Máximo BPM por sesión (opcionalmente solo de una variante), ordenado por fecha ascendente.
function bpmSeries(list,e,variant=''){
  return list.map(s=>{
    const legacy=variantNameForSession(s,e);
    const bpms=(s.tempoBlocks||[]).filter(b=>!variant||(blockVariantName(b,e)||legacy)===variant).map(b=>+b.bpm).filter(b=>b>0);
    return bpms.length?{date:new Date(s.date),bpm:Math.max(...bpms)}:null;
  }).filter(Boolean).sort((a,b)=>a.date-b.date);
}
// STATS-END
let statExercise='',statVariant='';

function periodRange(period,now,offset=0){
  let from,to;
  if(period==='week'){from=startDay(now);from.setDate(from.getDate()-((now.getDay()+6)%7)+7*offset);to=new Date(from);to.setDate(to.getDate()+7)}
  if(period==='month'){from=new Date(now.getFullYear(),now.getMonth()+offset,1);to=new Date(now.getFullYear(),now.getMonth()+offset+1,1)}
  if(period==='year'){from=new Date(now.getFullYear()+offset,0,1);to=new Date(now.getFullYear()+offset+1,0,1)}
  return [from,to];
}

function bpmChart(series){
  if(series.length<2)return '';
  const W=320,H=150,l=34,r=10,t=12,b=24,min=Math.min(...series.map(x=>x.bpm)),max=Math.max(...series.map(x=>x.bpm));
  const lo=Math.max(0,min-5),hi=max+5,x=i=>l+i*(W-l-r)/(series.length-1),y=v=>t+(hi-v)*(H-t-b)/(hi-lo);
  const pts=series.map((p,i)=>`${x(i).toFixed(1)},${y(p.bpm).toFixed(1)}`).join(' ');
  const dl=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  return `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%" role="img" aria-label="Evolución de BPM">
    ${[min,max].map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="#282e2e" stroke-dasharray="3 4"/><text x="${l-6}" y="${y(v)}" text-anchor="end" dominant-baseline="central" font-size="10" fill="#909898">${v}</text>`).join('')}
    <polyline points="${pts}" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${series.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.bpm)}" r="3.5" fill="#00F0FF"/>`).join('')}
    <text x="${l}" y="${H-6}" font-size="10" fill="#909898">${dl(series[0].date)}</text>
    <text x="${W-r}" y="${H-6}" text-anchor="end" font-size="10" fill="#909898">${dl(series[series.length-1].date)}</text>
  </svg>`;
}

function heatmap(a,now){
  const g=Math.max(1,goals().dailyMinutes),byDay={};
  a.forEach(s=>{const k=isoDay(new Date(s.date));byDay[k]=(byDay[k]||0)+(+s.practiceMinutes||0)});
  const [weekStart]=periodRange('week',now),first=new Date(weekStart);first.setDate(first.getDate()-7*11);
  const cells=[];
  for(let w=0;w<12;w++)for(let d=0;d<7;d++){
    const day=new Date(first);day.setDate(first.getDate()+w*7+d);
    const m=byDay[isoDay(day)]||0,lvl=day>now?-1:m<=0?0:m<g*.34?1:m<g*.67?2:m<g?3:4;
    cells.push(`<rect x="${20+w*24}" y="${d*20}" width="18" height="16" rx="4" fill="${lvl<0?'transparent':lvl?`rgba(0,240,255,${[0,.22,.45,.7,1][lvl]})`:'#202525'}"><title>${day.toLocaleDateString('es-ES')} · ${fmt(m)}</title></rect>`);
  }
  return `<svg viewBox="0 0 310 140" style="display:block;width:100%" role="img" aria-label="Mapa de constancia, últimas 12 semanas">
    ${['L','X','V','D'].map((l,i)=>`<text x="6" y="${i*40+8}" dominant-baseline="central" font-size="10" fill="#909898">${l}</text>`).join('')}${cells.join('')}</svg>
    <div class="time-row" style="margin-top:6px"><span>Hace 12 semanas</span><span>Menos ▢ → más ■ del objetivo</span></div>`;
}

function renderStats(){
  const all=sessions().filter(s=>statInstrument==='all'||instrumentOf(s)===statInstrument),now=new Date(),g=goals();
  const [from,to]=periodRange(statPeriod,now),[pFrom,pTo]=periodRange(statPeriod,now,-1);
  const inRange=(x,f,t)=>{const d=new Date(x.date);return d>=f&&d<t};
  const f=all.filter(s=>inRange(s,from,to)),prev=all.filter(s=>inRange(s,pFrom,pTo));
  const practice=sumMin(f),warm=f.reduce((n,s)=>n+(+s.warmupMinutes||0),0),prevPractice=sumMin(prev);
  const daySet=new Set(f.map(s=>isoDay(new Date(s.date)))),days=daySet.size,allDays=new Set(all.map(s=>isoDay(new Date(s.date))));
  const elapsed=Math.max(1,dayDiff(from,now<to?now:new Date(to-1))+1);
  const byDay={};f.forEach(s=>{const k=isoDay(new Date(s.date));byDay[k]=(byDay[k]||0)+(+s.practiceMinutes||0)});
  const goalDays=Object.values(byDay).filter(m=>m>=g.dailyMinutes).length;
  const prevName={week:'semana anterior',month:'mes anterior',year:'año anterior'}[statPeriod];
  const delta=prevPractice?Math.round((practice-prevPractice)/prevPractice*100):null;
  const bestDay=Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];

  let labelCount=[];
  if(statPeriod==='week')labelCount=Array.from({length:7},(_,i)=>{const d=new Date(from);d.setDate(d.getDate()+i);return [d.toLocaleDateString('es-ES',{weekday:'narrow'}),d]});
  if(statPeriod==='month')labelCount=Array.from({length:new Date(now.getFullYear(),now.getMonth()+1,0).getDate()},(_,i)=>[String(i+1),new Date(now.getFullYear(),now.getMonth(),i+1)]);
  if(statPeriod==='year')labelCount=Array.from({length:12},(_,i)=>[new Date(now.getFullYear(),i,1).toLocaleDateString('es-ES',{month:'narrow'}),new Date(now.getFullYear(),i,1)]);
  const bars=statPeriod==='year'?labelCount.map(([l,d])=>[l,sumMin(f.filter(s=>new Date(s.date).getMonth()===d.getMonth()))]):labelCount.map(([l,d])=>[l,sumMin(f.filter(s=>sameDay(s.date,d)))]);
  const max=Math.max(1,...bars.map(x=>x[1]));

  const cat=Object.fromEntries(categories.map(c=>[c,0]));f.forEach(s=>{const e=sessionExercise(s);cat[e.category]=(cat[e.category]||0)+(+s.practiceMinutes||0)});
  const catSorted=Object.entries(cat).sort((a,b)=>b[1]-a[1]),neglected=practice?catSorted[catSorted.length-1][0]:'';
  const exTotals={};f.forEach(s=>{const e=sessionExercise(s);exTotals[e.id]=exTotals[e.id]||{name:e.name,total:0,count:0};exTotals[e.id].total+=+s.practiceMinutes||0;exTotals[e.id].count++});
  const weekday=Array(7).fill(0);all.forEach(s=>weekday[(new Date(s.date).getDay()+6)%7]+=+s.practiceMinutes||0);const wdMax=Math.max(1,...weekday);
  const warmCount={};f.filter(s=>+s.warmupMinutes>0).forEach(s=>warmCount[s.warmup]=(warmCount[s.warmup]||0)+1);
  const topWarm=Object.entries(warmCount).sort((a,b)=>b[1]-a[1])[0];
  const diffAvg=f.length?(f.reduce((n,s)=>n+(+s.difficulty||3),0)/f.length).toFixed(1):'—';

  // Progreso por ejercicio
  const practiced=exercises().filter(e=>all.some(s=>s.exerciseId===e.id));
  const lastOf=e=>Math.max(...all.filter(s=>s.exerciseId===e.id).map(s=>+new Date(s.date)));
  if(!practiced.some(e=>e.id===statExercise)){statExercise=[...practiced].sort((a,b)=>lastOf(b)-lastOf(a))[0]?.id||'';statVariant=''}
  const ex=practiced.find(e=>e.id===statExercise),exSessions=ex?all.filter(s=>s.exerciseId===ex.id):[];
  const variantNames=ex?[...new Set(exSessions.flatMap(s=>(s.tempoBlocks||[]).map(b=>blockVariantName(b,ex)||variantNameForSession(s,ex)).filter(Boolean)))]:[];
  if(!variantNames.includes(statVariant))statVariant='';

const BACKUP_KEY=PREVIEW?'practica_preview_last_backup':'practica_last_backup';
function lastBackupText(){
  const t=localStorage.getItem(BACKUP_KEY);
  if(!t)return 'Nunca exportada';
  const days=Math.floor((Date.now()-new Date(t))/864e5);
  return `Última: ${new Date(t).toLocaleDateString('es-ES')}${days>=7?` · hace ${days} días`:''}`;
}
async function exportBackup(){
  const data={app:'practica',format:1,exportedAt:new Date().toISOString(),sessions:sessionStore,exercises:exerciseStore,goals:goals(),customScales};
  const name=`practica-backup-${isoDay(new Date())}.json`;
  const file=new File([JSON.stringify(data,null,1)],name,{type:'application/json'});
  try{
    // En iPhone, compartir permite "Guardar en Archivos"; si no existe, descarga normal.
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:name});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  }catch(err){if(err?.name==='AbortError')return;return toast('No se pudo exportar')}
  localStorage.setItem(BACKUP_KEY,new Date().toISOString());renderMore();toast('Copia exportada');
}
function parseBackup(text){
  const d=JSON.parse(text);
  if(d?.app!=='practica'||!Array.isArray(d.sessions)||!Array.isArray(d.exercises))throw new Error('formato');
  if(!d.sessions.every(s=>s&&s.id&&!isNaN(new Date(s.date))))throw new Error('sesiones');
  if(!d.exercises.every(e=>e&&e.id&&typeof e.name==='string'))throw new Error('ejercicios');
  return d;
}
async function importBackup(file){
  $('#importBackupFile').value='';
  if(!file)return;
  let d;
  try{d=parseBackup(await file.text())}catch{return toast('Archivo de copia no válido')}
  if(!confirm(`¿Importar ${d.sessions.length} prácticas y ${d.exercises.length} ejercicios? Se sustituirán los datos actuales de este dispositivo.`))return;
  saveExercises(d.exercises);saveSessions(d.sessions);if(d.goals)saveGoals(d.goals);
  if(Array.isArray(d.customScales))saveCustomScales(d.customScales.filter(validCustomScale));
  renderAll();toast('Copia importada');
}

async function loadAccessIdentity(){
  const el=$('#accessAccountEmail');
  if(!el)return;
  try{
    const res=await fetch('/cdn-cgi/access/get-identity',{
      credentials:'include',
      cache:'no-store'
    });
    if(!res.ok)throw new Error('identity');
    const data=await res.json();
    el.textContent=data?.email||data?.name||'Sesión iniciada';
  }catch{
    el.textContent='Sesión iniciada';
  }
}

function logoutAccessSession(){
  if(!confirm('¿Cerrar la sesión de Práctica? Tus prácticas guardadas en este dispositivo no se borrarán.'))return;
  window.location.assign('/cdn-cgi/access/logout');
}

async function changeCloudflareAccount(){
  if(!confirm('¿Cambiar de cuenta? Se cerrará la sesión de Práctica y también la sesión de Cloudflare. Después vuelve a abrir Práctica e inicia sesión con el otro correo.'))return;

  try{
    await fetch('/cdn-cgi/access/logout',{
      credentials:'include',
      cache:'no-store'
    });
  }catch{}

  window.location.assign('https://dash.cloudflare.com/oauth2/logout');
}

function saveVariantOnTheFly(){
  const exerciseId=$('#exercisePicker').value;

function refreshExerciseDatalist(){$('#exerciseList').innerHTML=exercises().map(e=>`<option value="${esc(e.name)}">${esc(e.category)}</option>`).join('')}
function refreshExercisePicker(){const p=$('#exercisePicker');if(!p)return;const current=p.value;p.innerHTML='<option value="">Elegir de la biblioteca…</option>'+exercises().map(e=>`<option value="${esc(e.id)}">${esc(e.name)} · ${esc(e.category)}</option>`).join('');if([...p.options].some(o=>o.value===current))p.value=current}
function exerciseVariants(e){return Array.isArray(e?.variants)?e.variants.filter(v=>v&&v.id&&v.name):[]}
function blockVariantName(block,e){
  if(block?.variantId){
    const v=exerciseVariants(e).find(v=>v.id===block.variantId);
    if(v)return v.name;
  }

}
function variantNameForSession(s,e=sessionExercise(s)){

function getTempoBlocks(){
  const exerciseId=$('#exercisePicker')?.value||'';
  const e=exercises().find(x=>x.id===exerciseId);
  return $$('#tempoRows .tempo-row').map(r=>{
    const variantId=r.querySelector('.block-variant')?.value||'',
          v=exerciseVariants(e).find(x=>x.id===variantId),
          minuteRaw=r.querySelector('.block-minutes')?.value.trim()||'';
    return {
      variantId,
      variantName:v?.name||r.dataset.legacyVariantName||'',
      bpm:+r.querySelector('.block-bpm')?.value||0,
      minutes:minuteRaw===''?null:Math.max(0,+minuteRaw||0)
    }
  }).filter(x=>x.bpm>0)

function updateTotal(){
  const w=$('#warmup').value==='Sin calentamiento'?0:+$('#warmupMinutes').value||0,
        p=Math.max(0,+$('#practiceMinutes').value||0),
        blocks=getTempoBlocks(),
        timedBlocks=blocks.filter(b=>b.minutes!=null&&b.minutes>0),
        untimedBlocks=blocks.filter(b=>b.minutes==null||b.minutes===0),
        assigned=timedBlocks.reduce((n,b)=>n+(+b.minutes||0),0);
  $('#warmupMinutes').disabled=$('#warmup').value==='Sin calentamiento';
  $('#totalPreview').textContent=fmt(w+p);

  const rem=p-assigned,el=$('#tempoSummary');
  if(!blocks.length){
    el.textContent='Sin bloques de práctica';
    el.classList.remove('warn');
  }else if(!timedBlocks.length){
    el.textContent=`${blocks.length} ${blocks.length===1?'tempo registrado':'tempos registrados'} · sin reparto de minutos`;
    el.classList.remove('warn');
  }else if(rem>0){
    el.textContent=`${fmt(assigned)} asignados${untimedBlocks.length?` · ${untimedBlocks.length} ${untimedBlocks.length===1?'bloque sin minutos':'bloques sin minutos'}`:''} · ${fmt(rem)} sin asignar`;
    el.classList.remove('warn');
  }else if(rem===0){
    el.textContent=`${fmt(assigned)} asignados${untimedBlocks.length?` · ${untimedBlocks.length} ${untimedBlocks.length===1?'bloque sin minutos':'bloques sin minutos'}`:''} · práctica completa`;
    el.classList.remove('warn');
  }else{
    el.textContent=`Los bloques con minutos superan la práctica por ${fmt(-rem)}`;
    el.classList.add('warn');
  }
}
function resetForm(){if($('#inlineVariantEditor'))hideInlineVariantEditor();$('#exerciseName').value='';$('#category').value=categories[0];$('#warmup').value=warmups[0];$('#warmupMinutes').value=0;$('#practiceMinutes').value=15;$('#notes').value='';difficulty=3;instrument=instrumentOf(sessions()[0]);renderInstrument();$('#tempoRows').innerHTML='';$('#date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);renderDifficulty();refreshExerciseDatalist();refreshExercisePicker();$('#exercisePicker').value='';refreshTempoVariantSelects();renderRecentChips();$('#moreDetails').open=false;syncPresetChips();updateTotal()}
function saveSession(){
  const fromPlayer=sessionFromPlayer;
  const name=$('#exerciseName').value.trim();if(!name)return toast('Escribe un ejercicio');
  const p=Math.max(1,+$('#practiceMinutes').value||0),
        blocks=getTempoBlocks(),
        assigned=blocks.reduce((n,b)=>n+(b.minutes==null?0:(+b.minutes||0)),0);
  if(assigned>p)return toast('Los bloques con minutos superan la duración');

  const e=ensureExercise(name,$('#category').value),
        w=$('#warmup').value==='Sin calentamiento'?0:+$('#warmupMinutes').value||0,
        d=$('#date').value?new Date($('#date').value):new Date(),
        a=sessions();

  const data={
    exerciseId:e.id,exerciseName:e.name,category:e.category,instrument,
    variantId:'',variantName:'',
    warmup:$('#warmup').value,warmupMinutes:w,practiceMinutes:p,
    tempoBlocks:blocks,date:d.toISOString(),difficulty,notes:$('#notes').value.trim()
  };

  if(editingSessionId){
    const i=a.findIndex(x=>x.id===editingSessionId);
    if(i===-1){
      toast('No se encontró la práctica a editar');
      return;
    }
    a[i]={...a[i],...data};
    saveSessions(a);
    closeSessionModal();
    renderAll();
    tab('home');
    requestAnimationFrame(()=>document.querySelector('.app')?.scrollTo({top:0,behavior:'smooth'}));
    toast('Práctica actualizada');
  }else{
    const saved={id:uuid(),...data};
    a.push(saved);
    saveSessions(a);

    const confirmed=sessionStore.some(x=>x.id===saved.id);
    if(!confirmed){
      toast('No se pudo guardar la práctica');
      return;
    }

    closeSessionModal();
    renderAll();
    if(fromPlayer&&player){
      // Se vuelve al reproductor sin cortar la música; el cronómetro empieza de cero.
      player.practice=new Map();practiceTick();
      if($('#playBtn'))renderPlayer();
      syncMini();
      toast('Práctica guardada');
      return;
    }
    tab('home');
    requestAnimationFrame(()=>document.querySelector('.app')?.scrollTo({top:0,behavior:'smooth'}));
    toast('Práctica guardada');
  }
}

  m.innerHTML=`<div class="topbar"><button id="cancelEditExercise">Cancelar</button><h2>Editar ejercicio</h2><button id="saveEditExercise">Guardar</button></div>

function saveEditedExercise(id){
  const name=$('#editExerciseName').value.trim(),category=$('#editExerciseCategory').value,variants=readVariantEditor('editExerciseVariants');
  if(!name)return toast('Escribe un nombre');
  const all=exercises(),e=all.find(x=>x.id===id);if(!e)return;
  if(all.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return toast('Ya existe un ejercicio con ese nombre');

  e.name=name;e.category=category;e.variants=variants;saveExercises(all);

  const variantMap=new Map(variants.map(v=>[v.id,v.name]));
  saveSessions(sessions().map(s=>{
    if(s.exerciseId!==id)return s;
    return {
      ...s,
      exerciseName:name,
      category,
      variantName:s.variantId&&variantMap.has(s.variantId)?variantMap.get(s.variantId):(s.variantName||''),
      tempoBlocks:(s.tempoBlocks||[]).map(b=>({
        ...b,
        variantName:b.variantId&&variantMap.has(b.variantId)?variantMap.get(b.variantId):(b.variantName||'')
      }))
    }
  }));

  renderAll();openExerciseDetail(id);toast('Ejercicio actualizado')
}

function deleteSavedExercise(id){
  const e=exercises().find(x=>x.id===id);if(!e)return;
  const linked=sessions().filter(s=>s.exerciseId===id);
  const total=linked.reduce((n,s)=>n+(+s.practiceMinutes||0),0);

  const message=linked.length
    ? `¿Eliminar “${e.name}”? También se eliminarán ${linked.length} ${linked.length===1?'práctica':'prácticas'} (${fmt(total)}) y se descontarán de todas las estadísticas.`
    : `¿Eliminar “${e.name}”?`;

  if(!confirm(message))return;

  saveExercises(exercises().filter(x=>x.id!==id));
  saveSessions(sessions().filter(s=>s.exerciseId!==id));

  renderAll();
  openExerciseLibrary();
  toast('Ejercicio eliminado');
}

// THEORY-START
const LETTERS=['C','D','E','F','G','A','B'],LETTER_PC=[0,2,4,5,7,9,11];
const CIRCLE_MAJOR=['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'];
const CIRCLE_MINOR=['A','E','B','F#','C#','G#','D#','Bb','F','C','G','D'];
const TUNINGS={Guitarra:['E','A','D','G','B','E'],Bajo:['E','A','D','G'],'Bajo 5':['B','E','A','D','G']};
// Cada escala se define por sus grados ('b3', '#4'…): de ellos salen los semitonos y la ortografía
// (cada grado usa la letra de su número contando desde la tónica).
const SCALE_GROUPS=[
  ['Mayor y sus modos',[['major','Mayor (jónica)','1 2 3 4 5 6 7'],['dorian','Dórica','1 2 b3 4 5 6 b7'],['phrygian','Frigia','1 b2 b3 4 5 b6 b7'],['lydian','Lidia','1 2 3 #4 5 6 7'],['mixolydian','Mixolidia','1 2 3 4 5 6 b7'],['minor','Menor natural (eólica)','1 2 b3 4 5 b6 b7'],['locrian','Locria','1 b2 b3 4 b5 b6 b7']]],
  ['Pentatónicas y blues',[['pentaMajor','Pentatónica mayor','1 2 3 5 6'],['pentaMinor','Pentatónica menor','1 b3 4 5 b7'],['blues','Blues','1 b3 4 b5 5 b7'],['bluesMajor','Blues mayor','1 2 b3 3 5 6'],['pentaSus','Pentatónica suspendida','1 2 4 5 b7']]],
  ['Menor armónica y sus modos',[['harmonicMinor','Menor armónica','1 2 b3 4 5 b6 7'],['locrianNat6','Locria ♮6','1 b2 b3 4 b5 6 b7'],['ionianSharp5','Jónica ♯5','1 2 3 4 #5 6 7'],['dorianSharp4','Dórica ♯4','1 2 b3 #4 5 6 b7'],['phrygianDominant','Frigia dominante','1 b2 3 4 5 b6 b7'],['lydianSharp2','Lidia ♯2','1 #2 3 #4 5 6 7'],['ultralocrian','Ultralocria','1 b2 b3 b4 b5 b6 bb7']]],
  ['Menor melódica y sus modos',[['melodicMinor','Menor melódica','1 2 b3 4 5 6 7'],['dorianFlat2','Dórica ♭2','1 b2 b3 4 5 6 b7'],['lydianAugmented','Lidia aumentada','1 2 3 #4 #5 6 7'],['lydianDominant','Lidia dominante','1 2 3 #4 5 6 b7'],['mixolydianFlat6','Mixolidia ♭6','1 2 3 4 5 b6 b7'],['locrianNat2','Locria ♮2','1 2 b3 4 b5 b6 b7'],['altered','Alterada (superlocria)','1 b2 b3 b4 b5 b6 b7']]],
  ['Bebop',[['bebopDominant','Bebop dominante','1 2 3 4 5 6 b7 7'],['bebopMajor','Bebop mayor','1 2 3 4 5 #5 6 7'],['bebopDorian','Bebop dórica','1 2 b3 3 4 5 6 b7']]],
  ['Simétricas',[['wholeTone','Tonos enteros','1 2 3 #4 #5 b7'],['dimWholeHalf','Disminuida (tono-semitono)','1 2 b3 4 b5 b6 6 7'],['dimHalfWhole','Disminuida (semitono-tono)','1 b2 #2 3 #4 5 6 b7'],['augmented','Aumentada','1 #2 3 5 #5 7'],['chromatic','Cromática','1 b2 2 b3 3 4 #4 5 b6 6 b7 7']]],
  ['Otras',[['harmonicMajor','Mayor armónica','1 2 3 4 5 b6 7'],['doubleHarmonic','Doble armónica (árabe)','1 b2 3 4 5 b6 7'],['hungarianMinor','Húngara menor','1 2 b3 #4 5 b6 7'],['hungarianMajor','Húngara mayor','1 #2 3 #4 5 6 b7'],['neapolitanMinor','Napolitana menor','1 b2 b3 4 5 b6 7'],['neapolitanMajor','Napolitana mayor','1 b2 b3 4 5 6 7'],['spanish8','Española de 8 notas','1 b2 #2 3 4 b5 b6 b7'],['persian','Persa','1 b2 3 4 b5 b6 7'],['enigmatic','Enigmática','1 b2 3 #4 #5 #6 7'],['prometheus','Prometeo','1 2 3 #4 6 b7'],['hirajoshi','Hirajoshi','1 2 b3 5 b6'],['inSen','In sen','1 b2 4 5 b7'],['iwato','Iwato','1 b2 4 b5 b7'],['kumoi','Kumoi','1 2 b3 5 6']]]
];
const SCALES=SCALE_GROUPS.flatMap(([group,list])=>list.map(([id,name,deg])=>({id,name,group,labels:deg.split(' ')})));
const CUSTOM_DEGREES=['1','b2','2','b3','3','4','b5','5','b6','6','b7','7'];
let customScales=[];
const scaleDef=id=>SCALES.find(s=>s.id===id)||customScales.find(s=>s.id===id)||SCALES[0];
const degreeStep=l=>{const m=/^(b*|#*)([1-7])$/.exec(l);return m?LETTER_PC[m[2]-1]+(m[1][0]==='#'?1:-1)*m[1].length:NaN};
const notePc=n=>(LETTER_PC[LETTERS.indexOf(n[0])]+[...n.slice(1)].reduce((x,c)=>x+(c==='#'?1:-1),0)+12)%12;
function spellLabels(tonic,labels){
  const l0=LETTERS.indexOf(tonic[0]),pc0=notePc(tonic);
  return labels.map(lab=>{
    const l=(l0+ +lab.slice(-1)-1)%7,acc=((pc0+degreeStep(lab)-LETTER_PC[l])%12+18)%12-6;
    return LETTERS[l]+(acc>0?'#'.repeat(acc):'b'.repeat(-acc));
  });
}
const spellScale=(tonic,mode)=>spellLabels(tonic,scaleDef(mode).labels);
// THEORY-END
const SOLFEGE={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
const degreeColor=l=>({'1':'#00F0FF','3':'#FFD166','b3':'#FFD166','5':'#B69CFF','7':'#FF6B7A','b7':'#FF6B7A','bb7':'#FF6B7A'})[l]||'#8A9696';
const pretty=n=>n.replace(/#/g,'♯').replace(/b/g,'♭');
const solfege=n=>`${SOLFEGE[n[0]]}${pretty(n.slice(1))}`;
const spanishName=(n,mode)=>`${solfege(n)} ${mode==='major'?'mayor':'menor'}`;
const SCALE_PREFS_KEY='practica_scales_prefs';
let scaleState={tonic:'C',mode:'major',degrees:[true,true,true,true,true,true,true],labels:'degrees',instrument:'Guitarra'};
try{scaleState={...scaleState,...JSON.parse(localStorage.getItem(SCALE_PREFS_KEY)||'{}')}}catch{}
const CUSTOM_SCALES_KEY=PREVIEW?'practica_preview_custom_scales':'practica_custom_scales_v1';
const validCustomScale=s=>!!s&&typeof s.id==='string'&&typeof s.name==='string'&&!!s.name.trim()&&Array.isArray(s.labels)&&s.labels[0]==='1'&&s.labels.length>=3&&s.labels.every(l=>CUSTOM_DEGREES.includes(l))&&new Set(s.labels).size===s.labels.length;
try{customScales=JSON.parse(localStorage.getItem(CUSTOM_SCALES_KEY)||'[]').filter(validCustomScale)}catch{}
function saveCustomScales(list){
  customScales=list;
  try{localStorage.setItem(CUSTOM_SCALES_KEY,JSON.stringify(list))}catch{toast('No se pudo guardar la escala')}
}
let scaleDraft=null; // escala propia en edición: {id|null, name, sel:[índices de CUSTOM_DEGREES]}

function circleSvg(){
  const cx=160,cy=160,pos=(i,r)=>{const a=(i*30-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const ring=scaleState.ring||(scaleState.mode==='minor'?'minor':'major');
  const key=(mode,n,i,r,size)=>{
    const [x,y]=pos(i,r),sel=ring===mode&&scaleState.tonic===n;
    const label=mode==='major'?pretty(n):pretty(n)+'m';
    return `<g data-key="${mode}:${n}" role="button" aria-label="${spanishName(n,mode)}">
      <circle cx="${x}" cy="${y}" r="${size}" fill="${sel?'rgba(0,240,255,.24)':'transparent'}" stroke="${sel?'rgba(0,240,255,.6)':'transparent'}"/>
      <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${mode==='major'?15:12}" ${sel?'style="fill:#00F0FF"':''}>${label}</text></g>`;
  };
  return `<svg class="circle5" viewBox="0 0 320 320">
    <circle cx="160" cy="160" r="150" fill="#151818" stroke="#202525"/>
    <circle cx="160" cy="160" r="104" fill="#111414" stroke="#202525"/>
    <circle cx="160" cy="160" r="62" fill="#0b0e0e" stroke="#202525"/>
    <text x="160" y="152" text-anchor="middle" font-size="11" style="fill:#909898;font-weight:600">Mayores fuera</text>
    <text x="160" y="170" text-anchor="middle" font-size="11" style="fill:#909898;font-weight:600">Menores dentro</text>
    ${CIRCLE_MAJOR.map((n,i)=>key('major',n,i,127,21)).join('')}
    ${CIRCLE_MINOR.map((n,i)=>key('minor',n,i,83,19)).join('')}
  </svg>`;
}

// Mástil en horizontal como en una tablatura: cuerda más aguda arriba, cejuela a la izquierda.
// Más ancho que el móvil: se desliza de lado dentro de su tarjeta.
function fretboardSvg(){
  const tuning=TUNINGS[scaleState.instrument]||TUNINGS.Guitarra,frets=15,n=tuning.length;
  const labels=scaleDef(scaleState.mode).labels,scale=spellScale(scaleState.tonic,scaleState.mode),pcs=scale.map(notePc);
  const nut=58,fretW=44,top=18,gap=34,W=nut+frets*fretW+16,bottom=top+(n-1)*gap,H=bottom+38;
  const xOf=f=>f===0?nut-24:nut+(f-.5)*fretW,yOf=i=>bottom-i*gap,mid=(top+bottom)/2;
  let out=`<svg class="fretboard" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mástil de ${scaleState.instrument.toLowerCase()}">`;
  out+=`<rect x="${nut}" y="${top-8}" width="${frets*fretW}" height="${bottom-top+16}" rx="4" fill="#151818"/>`;
  [3,5,7,9,15].forEach(f=>out+=`<circle cx="${xOf(f)}" cy="${mid}" r="5" fill="#2a3131"/>`);
  out+=`<circle cx="${xOf(12)}" cy="${mid-gap}" r="5" fill="#2a3131"/><circle cx="${xOf(12)}" cy="${mid+gap}" r="5" fill="#2a3131"/>`;
  for(let f=1;f<=frets;f++)out+=`<line x1="${nut+f*fretW}" x2="${nut+f*fretW}" y1="${top-8}" y2="${bottom+8}" stroke="#3a4242" stroke-width="2"/>`;
  out+=`<line x1="${nut}" x2="${nut}" y1="${top-8}" y2="${bottom+8}" stroke="#d9dede" stroke-width="5"/>`;
  [3,5,7,9,12,15].forEach(f=>out+=`<text x="${xOf(f)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#909898">${f}</text>`);
  tuning.forEach((t,i)=>{
    out+=`<text x="8" y="${yOf(i)}" dominant-baseline="central" font-size="11" fill="#909898">${pretty(t)}</text>`;
    out+=`<line x1="${nut}" x2="${W-16}" y1="${yOf(i)}" y2="${yOf(i)}" stroke="#7d8787" stroke-width="${1+(n-1-i)*.35}"/>`;
    for(let f=0;f<=frets;f++){
      const d=pcs.indexOf((notePc(t)+f)%12);
      if(d<0||!scaleState.degrees[d])continue;
      const label=pretty(scaleState.labels==='degrees'?labels[d]:scale[d]);
      out+=`<circle cx="${xOf(f)}" cy="${yOf(i)}" r="13" fill="${degreeColor(labels[d])}" ${f===0?'stroke="#f7f9f9" stroke-width="1.5"':''}/>
        <text x="${xOf(f)}" y="${yOf(i)}" text-anchor="middle" dominant-baseline="central" font-size="${label.length>2?9:11}" font-weight="800" fill="#00131f">${label}</text>`;
    }
  });
  return out+'</svg>';
}

function setScaleMode(id){
  const st=scaleState;st.mode=id;

function scaleEditorHtml(){

function saveScaleDraft(){

function renderScales(){
  const st=scaleState,def=scaleDef(st.mode),labels=def.labels,scale=spellScale(st.tonic,st.mode);
  st.mode=def.id;
  if(st.degrees.length!==labels.length)st.degrees=presetDegrees(labels,st.preset);
  try{localStorage.setItem(SCALE_PREFS_KEY,JSON.stringify(scaleState))}catch{}
  const custom=!def.group,seg=(attr,items,cur)=>`<div class="seg${items.length===2?' two':''}">${items.map(([k,l])=>`<button type="button" ${attr}="${k}" class="${cur===k?'active':''}">${l}</button>`).join('')}</div>`;
  const fretLeft=$('.fret-scroll')?.scrollLeft||0;
  const opts=list=>list.map(s=>`<option value="${esc(s.id)}" ${s.id===def.id?'selected':''}>${esc(s.name)}</option>`).join('');
  $('#scalesBody').innerHTML=`
    ${seg('data-scale-instrument',[['Guitarra','Guitarra'],['Bajo','Bajo'],['Bajo 5','Bajo 5']],st.instrument)}
    ${circleSvg()}
    <div class="key-title">${def.id==='major'||def.id==='minor'?`${spanishName(st.tonic,def.id)} · ${pretty(st.tonic)}${def.id==='minor'?'m':''}`:`${solfege(st.tonic)} · ${esc(def.name)}`}</div>
    <div class="key-notes">${scale.map(pretty).join(' · ')}</div>
    <div class="section-title">Escala</div>
    <div class="field" style="margin-bottom:8px"><select id="scaleType" aria-label="Tipo de escala">${SCALE_GROUPS.map(([g])=>`<optgroup label="${g}">${opts(SCALES.filter(s=>s.group===g))}</optgroup>`).join('')}${customScales.length?`<optgroup label="Mis escalas">${opts(customScales)}</optgroup>`:''}</select></div>
    ${scaleDraft?scaleEditorHtml():`<div class="block-actions" style="${custom?'':'grid-template-columns:1fr'}"><button type="button" class="secondary" id="newScale">+ Crear escala</button>${custom?`<button type="button" class="secondary" id="editScale">Editar</button><button type="button" class="danger" id="delScale" style="grid-column:1/-1">Borrar «${esc(def.name)}»</button>`:''}</div>`}
    <div class="section-title">Grados visibles</div>
    <div class="degree-chips">${labels.map((l,i)=>`<button type="button" data-degree="${i}" class="${st.degrees[i]?'on':''}" style="--deg:${degreeColor(l)}" aria-pressed="${st.degrees[i]}">${pretty(l)}</button>`).join('')}</div>
    <div class="preset-row">
      <button type="button" data-preset="1234567">Todos</button>
      <button type="button" data-preset="1">Tónica</button>
      <button type="button" data-preset="135">Tríada</button>
      <button type="button" data-preset="1357">Cuatriada</button>
    </div>
    <div class="section-title">Mástil</div>
    ${seg('data-scale-labels',[['degrees','Grados'],['notes','Notas']],st.labels)}
    <div class="card fret-scroll">${fretboardSvg()}</div>`;
  $('.fret-scroll').scrollLeft=fretLeft;
  $$('[data-key]').forEach(g=>g.onclick=()=>{const [ring,n]=g.dataset.key.split(':');st.ring=ring;st.tonic=n;if(st.mode==='major'||st.mode==='minor')st.mode=ring;renderScales()});

  $$('[data-scale-instrument]').forEach(b=>b.onclick=()=>{st.instrument=b.dataset.scaleInstrument;renderScales()});
  $$('[data-scale-labels]').forEach(b=>b.onclick=()=>{st.labels=b.dataset.scaleLabels;renderScales()});
  if(scaleDraft){
    $('#csName').oninput=e=>scaleDraft.name=e.target.value;
    $$('[data-cs]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cs,sel=scaleDraft.sel;scaleDraft.sel=sel.includes(i)?sel.filter(x=>x!==i):[...sel,i].sort((x,y)=>x-y);renderScales()});
    $('#csCancel').onclick=()=>{scaleDraft=null;renderScales()};

    $('#delScale').onclick=()=>{if(!confirm(`¿Borrar la escala «${def.name}»?`))return;saveCustomScales(customScales.filter(x=>x.id!==def.id));setScaleMode('major');renderScales()};

// ---------- Separador de pistas ----------
const STEM_INFO={drums:['Batería','#FF9F43'],bass:['Bajo','#4DA3FF'],guitar:['Guitarra','#4EEE7C'],piano:['Piano','#FFD166'],vocals:['Voz','#FF6B7A'],other:['Otros','#B276FF']};
const STEM_ORDER=['guitar','bass','drums','vocals','piano','other'];
const SONG_DB=PREVIEW?'practica_preview_songs':'practica_songs';
let separatorJob=null, player=null;

function songStore(mode,fn){
  return new Promise((ok,ko)=>{
    const open=indexedDB.open(SONG_DB,1);
    open.onupgradeneeded=()=>open.result.createObjectStore('songs',{keyPath:'id'});
    open.onerror=()=>ko(open.error);
    open.onsuccess=()=>{
      const db=open.result,tx=db.transaction('songs',mode),req=fn(tx.objectStore('songs'));
      tx.oncomplete=()=>{db.close();ok(req?.result)};
      tx.onerror=tx.onabort=()=>{db.close();ko(tx.error)};
    };
  });
}
const listSongs=()=>songStore('readonly',st=>st.getAll());
const putSong=song=>songStore('readwrite',st=>st.put(song));
const removeSong=id=>songStore('readwrite',st=>st.delete(id));
const fmtClock=sec=>{sec=Math.max(0,Math.floor(sec||0));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`};
const fmtMB=b=>`${Math.round(b/1048576)} MB`;

function openStems(songId){
  const m=$('#toolModal');
  m.innerHTML=`<div class="topbar"><button id="closeStems">Cerrar</button><h2>Pistas</h2><button aria-hidden="true" tabindex="-1"></button></div><div class="form" id="stemsBody"></div>`;
  m.classList.add('open');m.scrollTop=0;
  $('#closeStems').onclick=()=>{m.classList.remove('open');syncMini()};
  songId?openPlayer(songId):renderSongList();
}

async function renderSongList(){
  const body=$('#stemsBody');if(!body)return;
  let songs=[];try{songs=await listSongs()}catch{}
  songs.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const est=await (navigator.storage?.estimate?.()||Promise.resolve(null)).catch(()=>null);
  const job=separatorJob;
  body.innerHTML=`
    <button id="pickSong" class="primary wide" type="button" ${job?'disabled':''}>+ Subir canción</button>
    <input id="songFile" class="hidden-file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac">
    <div class="empty" style="font-size:12px;margin:9px 4px 0">Se separa en 6 pistas (guitarra, bajo, batería, voz, piano y otros) con IA dentro de tu móvil; el audio no sale del dispositivo. La primera vez descarga el modelo (57 MB). Mantén la app abierta mientras procesa.</div>
    ${job?`<div class="card" style="margin-top:14px"><strong>${esc(job.name)}</strong><div class="progress"><i id="jobBar" style="width:${Math.round(job.value*100)}%"></i></div><div id="jobText" class="muted" style="font-size:12px">${esc(job.text)}</div><button id="cancelJob" class="secondary wide" style="margin-top:10px" type="button">Cancelar</button></div>`:''}
    <div class="section-title">Canciones</div>
    ${songs.length?`<div class="card">${songs.map(s=>`<div class="song-row" data-song="${esc(s.id)}"><div class="grow"><strong>${esc(s.name)}</strong><div class="muted" style="font-size:12px;margin-top:3px">${fmtClock(s.frames/44100)} · ${s.bpm?`${s.bpm} BPM · `:''}${fmtMB(s.bytes)}</div></div><button class="icon-btn" data-del-song="${esc(s.id)}" aria-label="Borrar canción">×</button></div>`).join('')}</div>`:'<div class="card empty">Todavía no hay canciones separadas.</div>'}
    ${est?`<div class="empty" style="font-size:12px;margin:9px 4px 0">Espacio usado por la app: ${fmtMB(est.usage)}</div>`:''}`;
  $('#pickSong').onclick=()=>$('#songFile').click();
  $('#songFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)startSeparation(f)};
  if(job)$('#cancelJob').onclick=cancelSeparation;
  $$('[data-song]').forEach(r=>r.onclick=e=>{if(!e.target.closest('[data-del-song]'))openPlayer(r.dataset.song)});
  $$('[data-del-song]').forEach(b=>b.onclick=async()=>{
    const s=songs.find(x=>x.id===b.dataset.delSong);
    if(!confirm(`¿Borrar “${s.name}” y sus pistas separadas?`))return;
    if(player?.song.id===s.id)stopPlayer();
    await removeSong(s.id);renderSongList();toast('Canción borrada');
  });
}

function updateJob(value,text){
  if(!separatorJob)return;
  separatorJob.value=value;separatorJob.text=text;
  const bar=$('#jobBar'),label=$('#jobText');
  if(bar)bar.style.width=`${Math.round(value*100)}%`;
  if(label)label.textContent=text;
}

async function startSeparation(file){
  const name=file.name.replace(/\.[^.]+$/,'');
  separatorJob={name,value:0,text:'Leyendo audio…'};
  renderSongList();
  try{separatorJob.wakeLock=await navigator.wakeLock?.request('screen')}catch{}
  let audio;
  try{audio=await new OfflineAudioContext(2,1,44100).decodeAudioData(await file.arrayBuffer())}
  catch{finishJob();return toast('No se pudo leer ese audio')}
  const left=audio.getChannelData(0).slice(),right=(audio.numberOfChannels>1?audio.getChannelData(1):audio.getChannelData(0)).slice();
  const frames=left.length,worker=new Worker('separator-worker.js');
  separatorJob.worker=worker;
  worker.onmessage=async({data})=>{
    if(data.type==='progress'){
      if(data.phase==='download')updateJob(data.value*.1,`Descargando modelo… ${Math.round(data.value*100)}%`);
      else if(data.phase==='prepare')updateJob(.1,'Preparando IA…');
      else updateJob(.1+data.value*.9,`Separando… ${Math.round(data.value*100)}%${data.eta>5?` · quedan ~${fmtClock(data.eta)}`:''}${data.ep==='wasm'?' · CPU':''}`);
      return;
    }
    worker.terminate();
    if(data.type==='error'){finishJob();return toast(data.message==='download'||data.message==='hash'?'No se pudo descargar el modelo':'Error al separar la canción')}
    const stems={};let bytes=0;
    for(const [k,arr] of Object.entries(data.stems)){stems[k]=new Blob([arr]);bytes+=arr.byteLength}
    const song={id:uuid(),name,createdAt:new Date().toISOString(),frames,bpm:data.bpm||null,bytes,stems};
    try{await putSong(song)}catch{finishJob();return toast('No hay espacio para guardar las pistas')}
    const listShown=!!$('#songFile');
    finishJob();toast('Canción separada');if(listShown)openPlayer(song.id);
  };
  worker.onerror=()=>{finishJob();toast('Error al separar la canción')};
  worker.postMessage({type:'separate',left,right},[left.buffer,right.buffer]);
}
function finishJob(){
  separatorJob?.worker?.terminate();
  separatorJob?.wakeLock?.release?.().catch(()=>{});
  separatorJob=null;
  if($('#songFile'))renderSongList();
}
function cancelSeparation(){
  if(confirm('¿Cancelar la separación?'))finishJob();
}

// Mezcla las pistas activas en un WAV para un único <audio>: así el cambio de BPM usa el estirado
// de tiempo nativo del navegador (preservesPitch) y no cambia el tono.
function mixToWav(){
  const p=player,n=p.song.frames*2,buf=new ArrayBuffer(44+n*2),dv=new DataView(buf);
  const str=(o,t)=>[...t].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
  str(0,'RIFF');dv.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);
  const sr=Math.round(44100*p.srcRatio);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);str(36,'data');dv.setUint32(40,n*2,true);
  const out=new Int16Array(buf,44),active=STEM_ORDER.map(k=>[p.data[k],stemGain(k)]).filter(([a,g])=>a&&g>0);
  for(let i=0;i<n;i++){let v=0;for(const [a,g] of active)v+=a[i]*g;out[i]=v>32767?32767:v<-32768?-32768:v}
  return new Blob([buf],{type:'audio/wav'});
}
// Tono: el WAV se declara a 44100·r Hz (suena r veces más agudo y rápido) y playbackRate/r con preservesPitch
// devuelve el tempo sin tocar el tono. Por eso las posiciones se guardan en segundos de canción.
const songPos=()=>player.audio.currentTime*player.srcRatio;
const seekSong=t=>{player.audio.currentTime=t/player.srcRatio};
const stemGain=k=>player.solo?(player.solo===k?player.vol[k]:0):(player.mute[k]?0:player.vol[k]);

function applyRate(){
  const p=player,rate=Math.min(1.5,Math.max(.5,p.song.bpm?p.target/p.song.bpm:p.rate));
  p.audio.defaultPlaybackRate=p.audio.playbackRate=rate/p.srcRatio;
  p.audio.preservesPitch=true;p.audio.webkitPreservesPitch=true;
}
function remix(){
  const p=player,t=songPos(),playing=!p.audio.paused,old=p.url;
  p.srcRatio=2**(p.semi/12);
  p.url=URL.createObjectURL(mixToWav());
  p.audio.src=p.url;
  p.audio.onloadedmetadata=()=>{seekSong(t);applyRate();if(playing)p.audio.play().catch(()=>{})};
  if(old)URL.revokeObjectURL(old);
}

async function openPlayer(id){
  if(player?.song.id===id)return renderPlayer();
  const song=(await listSongs()).find(s=>s.id===id);
  if(!song){renderSongList();return toast('Esa canción ya no está guardada')}
  stopPlayer();
  $('#stemsBody').innerHTML='<div class="card empty">Cargando pistas…</div>';
  const data={};
  for(const [k,b] of Object.entries(song.stems))data[k]=new Int16Array(await b.arrayBuffer());
  player={song,data,audio:new Audio(),url:null,vol:Object.fromEntries(STEM_ORDER.map(k=>[k,1])),mute:{},solo:null,target:song.bpm||100,rate:1,practice:new Map(),lastTick:null,loop:null,semi:0,srcRatio:1};
  player.audio.ontimeupdate=()=>{checkLoop();const r=$('#seek');if(r&&!r.matches(':active')){const t=songPos();r.value=t;$('#curTime').textContent=fmtClock(t)}};
  player.audio.onplay=player.audio.onpause=()=>{practiceTick();const b=$('#playBtn');if(b)b.textContent=player.audio.paused?'▶':'❚❚';syncMini();syncPlaybackNotice()};
  remix();renderPlayer();renderHome();
}

// ---------- Bucle: 1.er toque = inicio, 2.º = cierra y repite, 3.º = quita ----------
function loopTap(){
  const p=player;if(!p)return;
  const t=songPos();
  if(!p.loop)p.loop={a:t,b:null};
  else if(p.loop.b==null){
    if(t-p.loop.a<0.5)return toast('Avanza un poco más para cerrar el bucle');
    p.loop.b=t;seekSong(p.loop.a);
  }else p.loop=null;
  const b=$('#loopBtn');if(b){b.textContent=loopLabel();b.classList.toggle('on',!!p.loop);b.setAttribute('aria-pressed',!!p.loop)}
}
function checkLoop(){
  const l=player?.loop;
  if(l?.b==null)return;
  const t=songPos();
  if(t>=l.b||t<l.a-0.5)seekSong(l.a);
}
const loopLabel=()=>{const l=player.loop;return !l?'⟲ Bucle: marcar inicio':l.b==null?`⟲ Cerrar bucle (desde ${fmtClock(l.a)})`:`⟲ Bucle ${fmtClock(l.a)} – ${fmtClock(l.b)} · quitar`};
// timeupdate llega cada ~250 ms: el intervalo hace el salto más preciso con la app abierta.
setInterval(checkLoop,40);

// ---------- Aviso "Práctica en curso" en la pantalla de bloqueo ----------
// Se publica al ocultarse la app (al bloquear), no al pulsar play: algunos móviles (Xiaomi) no enseñan en el
// bloqueo las notificaciones creadas con la pantalla encendida porque las dan por vistas.
const PLAY_NOTICE_TAG='practica-reproduccion';
const askNoticePermission=()=>{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})};
async function syncPlaybackNotice(){
  const reg=await navigator.serviceWorker?.getRegistration().catch(()=>null);
  if(!reg?.showNotification)return;
  (await reg.getNotifications({tag:PLAY_NOTICE_TAG}).catch(()=>[])).forEach(n=>n.close());
  const p=player;
  if(!p||p.audio.paused||document.visibilityState!=='hidden'||Notification.permission!=='granted')return;
  reg.showNotification('Práctica en curso',{tag:PLAY_NOTICE_TAG,body:`${p.song.name}${p.song.bpm?` · ${Math.round(p.target)} BPM`:''}`,icon:'icons/icon-192.png',badge:'icons/icon-192.png',silent:true}).catch(()=>{});
}
document.addEventListener('visibilitychange',syncPlaybackNotice);

// ---------- Modo práctica con canción ----------
let sessionFromPlayer=false;
const practiceSeconds=()=>player?[...player.practice.values()].reduce((a,b)=>a+b,0):0;
const practiceText=()=>fmtClock(practiceSeconds());
// Acumula el tiempo sonando desde el último tick en el BPM de práctica actual (0 = BPM desconocido).
function practiceTick(){
  const p=player;if(!p)return;
  const now=performance.now();
  if(p.lastTick!=null){const k=p.song.bpm?Math.round(p.target):0;p.practice.set(k,(p.practice.get(k)||0)+(now-p.lastTick)/1000)}
  p.lastTick=p.audio.paused?null:now;
}
function stopPlayer(){
  if(!player)return;
  // Quitar los avisos antes de pausar: el evento 'pause' llega cuando player ya es null.
  player.audio.onplay=player.audio.onpause=player.audio.ontimeupdate=null;
  player.audio.pause();if(player.url)URL.revokeObjectURL(player.url);
  player=null;syncMini();syncPlaybackNotice();renderHome();
}
function syncMini(){
  const m=$('#miniPlayer'),p=player,inPlayer=$('#toolModal').classList.contains('open')&&!!$('#playBtn');
  const show=!!p&&!inPlayer;
  m.hidden=!show;document.body.classList.toggle('has-mini',show);
  const now=$('#practiceNow');if(now&&p)now.textContent=practiceText();
  if(!show)return;
  $('#miniTitle').textContent=p.song.name;
  $('#miniSub').textContent=`${p.song.bpm?`${Math.round(p.target)} BPM · `:''}${practiceText()} de práctica`;
  $('#miniPlay').textContent=p.audio.paused?'▶':'❚❚';
}
function songExercise(song){
  const all=exercises();
  let e=all.find(x=>x.songId===song.id)||all.find(x=>x.name.toLowerCase()===song.name.toLowerCase());
  if(!e){e={id:uuid(),name:song.name,category:'Repertorio',variants:[],createdAt:new Date().toISOString()};all.push(e)}
  e.songId=song.id;saveExercises(all);
  return e;
}
function logPracticeFromPlayer(){
  practiceTick();
  const p=player,secs=practiceSeconds();
  if(secs<30)return toast('Toca un poco más: aún no hay tiempo de práctica');
  const e=songExercise(p.song);
  const blocks=[...p.practice].filter(([bpm,t])=>bpm>0&&t>=15).map(([bpm,t])=>({bpm,minutes:t>=60?Math.round(t/60):''}));
  const off=STEM_ORDER.filter(k=>p.solo?p.solo!==k:p.mute[k]).map(k=>STEM_INFO[k][0].toLowerCase());
  sessionFromPlayer=true;
  openSessionModal();
  refreshExercisePicker();$('#exercisePicker').value=e.id;chooseExercise();
  $('#practiceMinutes').value=Math.max(1,Math.round(secs/60));
  if(p.mute.guitar||p.mute.bass){instrument=p.mute.bass&&!p.mute.guitar?'Bajo':'Guitarra';renderInstrument()}
  blocks.forEach(b=>addTempoRow(b.bpm,b.minutes));
  // Los minutos redondeados de los bloques no pueden superar el total.
  const total=+$('#practiceMinutes').value,assigned=blocks.reduce((n,b)=>n+(+b.minutes||0),0);
  if(assigned>total)$('#practiceMinutes').value=assigned;
  $('#notes').value=`Con el separador de pistas${off.length?` (sin ${off.join(', ')})`:''}.`;
  updateTotal();
}
setInterval(()=>{practiceTick();syncMini()},1000);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function moveNavIndicator(target){const nav=document.querySelector('.nav'),ind=document.querySelector('.nav-indicator');if(!nav||!ind||!target)return;const nr=nav.getBoundingClientRect(),tr=target.getBoundingClientRect();ind.style.width=`${tr.width}px`;ind.style.transform=`translateX(${tr.left-nr.left}px)`}
function syncNavIndicator(){moveNavIndicator(document.querySelector('[data-tab].active'))}
function closeOpenOverlays(){
  sessionFromPlayer=false;
  $$('.modal.open').forEach(m=>m.classList.remove('open'));
  syncMini();
  if(document.activeElement&&typeof document.activeElement.blur==='function')document.activeElement.blur();
}
function tab(id){
  closeOpenOverlays();
  $$('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  $$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  moveNavIndicator(document.querySelector(`[data-tab="${id}"]`));
  if(id==='stats')renderStats();
  if(id==='history')renderHistory();
  if(id==='more')renderMore();
}

migrateV1();
navigator.storage?.persist?.().catch(()=>{});
$('#category').innerHTML=categories.map(x=>`<option>${x}</option>`).join('');$('#warmup').innerHTML=warmups.map(x=>`<option>${x}</option>`).join('');
$$('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('#addBtn').onclick=()=>openSessionModal();$('#cancelSession').onclick=closeSessionModal;$('#saveSession').onclick=saveSession;$('#addTempo').onclick=()=>{const last=$$('#tempoRows .tempo-row').pop(),bpm=+last?.querySelector('.block-bpm').value;addTempoRow(bpm?bpm+5:'','',last?.querySelector('.block-variant').value||'')};$$('[data-min]').forEach(b=>b.onclick=()=>{$('#practiceMinutes').value=b.dataset.min;syncPresetChips();updateTotal()});$('#warmup').onchange=updateTotal;$('#warmupMinutes').oninput=updateTotal;$('#practiceMinutes').oninput=()=>{syncPresetChips();updateTotal()};$('#exerciseName').oninput=syncExerciseCategory;$('#exercisePicker').onchange=chooseExercise;$('#addInlineVariant').onclick=showInlineVariantEditor;$('#saveInlineVariant').onclick=saveVariantOnTheFly;$('#cancelInlineVariant').onclick=hideInlineVariantEditor;$('#inlineVariantName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveVariantOnTheFly()}});
$('#miniOpen').onclick=()=>player&&openStems(player.song.id);
$('#miniPlay').onclick=()=>{if(!player)return;askNoticePermission();player.audio.paused?player.audio.play().catch(()=>toast('No se pudo reproducir')):player.audio.pause()};
$('#miniClose').onclick=()=>{if(!player)return;if(practiceSeconds()>=60&&!confirm(`Tienes ${practiceText()} de práctica sin guardar. ¿Cerrar la canción igualmente?`))return;stopPlayer()};
resetForm();renderAll();requestAnimationFrame(syncNavIndicator);window.addEventListener('resize',syncNavIndicator);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',updateKeyboardOffset);
  window.visualViewport.addEventListener('scroll',updateKeyboardOffset);
}

</script>








<script>
if (PREVIEW && 'serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
} else if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      await reg.update();
    } catch (err) {
      console.error(err);
    }
  });
}
</script>
